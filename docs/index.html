/* ---------- Ouvir ---------- */
const P={itemId:null,title:'',chunks:[],idx:0,state:'idle',engine:null,queuedTo:0,token:0,last:0,utter:null};
const hasBrowserVoice='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let claudeVoiceOff=false;
function engineAvailable(e){return e==='claude'?!!tts&&!claudeVoiceOff:hasBrowserVoice;}
function chosenEngine(){if(prefs.engine&&engineAvailable(prefs.engine))return prefs.engine;return engineAvailable('claude')?'claude':(hasBrowserVoice?'browser':null);}
function ptVoices(){if(!hasBrowserVoice)return [];const v=speechSynthesis.getVoices();const pt=v.filter(x=>/^pt/i.test(x.lang));return pt.concat(v.filter(x=>!/^pt/i.test(x.lang)));}
function pickVoice(){const v=ptVoices();return v.find(x=>x.voiceURI===prefs.voice)||v.find(x=>/pt[-_]BR/i.test(x.lang)&&/natural|google|online/i.test(x.name))||v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}
if(hasBrowserVoice){try{speechSynthesis.getVoices();}catch(e){}speechSynthesis.onvoiceschanged=()=>{if(current&&paneMode==='ouvir')fillVoices();};}

async function loadPlayer(it,engine){
  const body=it.parts?await loadBody(it):'';
  const src=speechText((it.title||'')+'.\n'+(body||it.note||''));
  P.itemId=it.id;P.title=it.title;P.engine=engine;
  P.chunks=chunkify(src,engine==='claude'?1500:220);
  const off=lsGet('pos:'+it.id,0);const i=P.chunks.findIndex((c,k)=>k===P.chunks.length-1||P.chunks[k+1].start>off);
  P.idx=Math.max(0,i);P.state='idle';
}
function savePos(){if(P.itemId&&P.chunks[P.idx])lsSet('pos:'+P.itemId,P.chunks[P.idx].start);}
async function playItem(id){
  const it=items.get(id);if(!it)return;
  const engine=chosenEngine();if(!engine){toast('este navegador não lê em voz alta.');return;}
  if(engine==='browser'){try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}}
  bgAudio(true);
  if(P.itemId!==id||P.engine!==engine){stopPlayer(true);bgAudio(true);await loadPlayer(it,engine);}
  if(!P.chunks.length){bgAudio(false);toast('sem texto para ouvir.');return;}
  if(P.idx>=P.chunks.length)P.idx=0;
  startFrom(P.idx);
}
function startFrom(i){
  P.idx=Math.max(0,Math.min(i,P.chunks.length-1));
  if(prefs.awake)keepAwake(true);
  bgAudio(true);
  if(P.engine==='claude'){
    const lines=P.chunks.slice(P.idx,P.idx+60).map((c,k)=>({text:c.text,id:String(P.idx+k)}));
    P.queuedTo=P.idx+lines.length;P.state='starting';
    if(tts.setRate)tts.setRate(clampClaude(prefs.rate));
    tts.speak(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
  }else speakBrowser(P.idx);
  updatePlayerUI();
}
function clampClaude(r){return Math.max(0.7,Math.min(1.5,r));}
function pausePlayer(){
  if(P.state==='idle')return;
  if(P.engine==='claude'){tts.pause().catch(()=>{});}
  else{P.token++;speechSynthesis.cancel();}
  P.state='paused';savePos();keepAwake(false);bgAudio(false);updatePlayerUI();
}
function resumePlayer(){
  if(P.engine==='claude'){if(prefs.awake)keepAwake(true);tts.resume().catch(()=>startFrom(P.idx));P.state='speaking';}
  else startFrom(P.idx);
  updatePlayerUI();
}
function stopPlayer(silent){
  if(P.engine==='claude'&&tts&&P.state!=='idle')tts.stop().catch(()=>{});
  if(P.engine==='browser'&&hasBrowserVoice){P.token++;speechSynthesis.cancel();}
  savePos();P.state='idle';keepAwake(false);bgAudio(false);
  if(!silent){updatePlayerUI();renderInicio();}
}
function finishPlayer(){
  const id=P.itemId;lsSet('pos:'+id,0);P.idx=0;P.state='idle';keepAwake(false);bgAudio(false);updatePlayerUI();
  const it=items.get(id);if(it&&!it.done){patch(id,{done:true});renderAll();toast('fim. marcado como consumido.',()=>{patch(id,{done:false});renderAll();});}else{renderInicio();toast('fim.');}
}
function togglePlayer(id){
  id=id||P.itemId;
  if(P.itemId===id&&(P.state==='speaking'||P.state==='starting'))pausePlayer();
  else if(P.itemId===id&&P.state==='paused')resumePlayer();
  else playItem(id);
}
function jump(d){if(!P.chunks.length)return;const i=Math.max(0,Math.min(P.idx+d,P.chunks.length-1));if(P.state==='idle'||P.state==='paused'){P.idx=i;savePos();updatePlayerUI();}else startFrom(i);}

function speakBrowser(i){
  const my=++P.token;const ss=speechSynthesis;
  if(i>=P.chunks.length){ss.cancel();finishPlayer();return;}
  P.idx=i;P.state='speaking';P.last=Date.now();updatePlayerUI();
  const u=new SpeechSynthesisUtterance(P.chunks[i].text);
  P.utter=u;
  const v=pickVoice();u.lang=v?v.lang.replace('_','-'):'pt-BR';if(v)u.voice=v;u.rate=prefs.rate;
  u.onstart=()=>{if(my===P.token)P.last=Date.now();};
  u.onend=()=>{if(my!==P.token)return;savePos();speakBrowser(i+1);};
  u.onerror=e=>{if(my!==P.token)return;if(e.error==='interrupted'||e.error==='canceled')return;P.state='paused';bgAudio(false);updatePlayerUI();toast('a voz parou. toque em tocar.');};
  const go=()=>{if(my!==P.token)return;try{ss.resume();}catch(e){}ss.speak(u);};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,90);}else go();
}
setInterval(()=>{
  if(P.engine!=='browser'||P.state!=='speaking'||!hasBrowserVoice||document.visibilityState!=='visible')return;
  const ss=speechSynthesis;
  if(!ss.speaking&&!ss.pending&&Date.now()-P.last>2500)speakBrowser(P.idx);
  else if(ss.paused){try{ss.resume();}catch(e){}}
},1500);

function wireTts(){
  tts.onState(({state,reason})=>{
    if(P.engine!=='claude')return;
    if(state!=='idle'){P.state=state;updatePlayerUI();return;}
    if(reason==='replaced')return;
    if(reason==='completed'){if(P.queuedTo<P.chunks.length){topUp(true);return;}finishPlayer();return;}
    P.state=reason==='hidden'?'paused':'idle';savePos();keepAwake(false);
    if(reason==='hidden')toast('pausou porque a tela saiu do app.');
    if(reason==='rate_limited')toast('limite da voz claude. troque para a voz do navegador.');
    if(reason==='not_granted'||reason==='unavailable'){claudeVoiceOff=true;toast('voz claude desligada.');}
    if(reason==='upstream_error')toast('a voz falhou. toque em tocar.');
    updatePlayerUI();renderInicio();
  });
  tts.onLine(({id})=>{if(P.engine!=='claude'||id==null)return;P.idx=+id;savePos();topUp(false);updatePlayerUI();});
}
function topUp(force){
  if(P.engine!=='claude'||P.queuedTo>=P.chunks.length)return;
  if(!force&&P.queuedTo-P.idx>10)return;
  const from=P.queuedTo;const lines=P.chunks.slice(from,from+50).map((c,k)=>({text:c.text,id:String(from+k)}));
  P.queuedTo=from+lines.length;
  tts.add(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
}
function ttsErr(e){
  const c=e&&e.code;if(c==='stopped')return;
  P.state='idle';keepAwake(false);
  if(c==='not_granted'){claudeVoiceOff=true;toast('voz claude desligada. use a voz do navegador.');}
  else if(c==='no_gesture')toast('toque em tocar de novo.');
  else if(c==='busy')toast('microfone em uso. tente já.');
  else if(c==='rate_limited')toast('limite da voz claude. use a voz do navegador.');
  else toast('a voz não respondeu. tente de novo.');
  updatePlayerUI();
}

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
let silent=null;
function bgAudio(on){
  if(mode!=='local')return;
  try{
    if(on){
      if(!silent){
        const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
        const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
        w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
        dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
        silent=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));silent.loop=true;
      }
      const p=silent.play();if(p&&p.catch)p.catch(()=>{});
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:P.title||'biblioteca',artist:'talse'});
        const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
        h('play',()=>{if(P.state==='paused')resumePlayer();});h('pause',()=>pausePlayer());
        h('nexttrack',()=>jump(1));h('previoustrack',()=>jump(-1));h('stop',()=>stopPlayer());
      }
    }else if(silent)silent.pause();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{

  if(!it.parts&&!it.note){pane.innerHTML='<p class="empty">cole o texto em ler para ouvir.</p>';return;}
  const two=tts&&!claudeVoiceOff&&hasBrowserVoice;
  /* Usa atributo switch nativo do Safari 17.4+ para acionar o Taptic Engine no toque direto */

const OEMBED=[
  [/(^|\.)(youtube\.com|youtu\.be)$/,u=>'https://www.youtube.com/oembed?format=json&url='+u],
  [/(^|\.)spotify\.com$/,u=>'https://open.spotify.com/oembed?url='+u],
  [/(^|\.)tiktok\.com$/,u=>'https://www.tiktok.com/oembed?url='+u],
  [/(^|\.)vimeo\.com$/,u=>'https://vimeo.com/api/oembed.json?url='+u]

async function fetchTitle(id,url){
  if(mode!=='local'||!url)return;
  const h=hostOf(url);const m=OEMBED.find(o=>o[0].test(h));if(!m)return;
  try{
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch(m[1](encodeURIComponent(url)),{signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)return;const j=await r.json();
    let t=String(j.title||'').replace(/\s+/g,' ').trim();if(!t)return;
    if(j.author_name&&!t.includes(j.author_name)&&t.length<70)t+=' · '+j.author_name;
    const it=items.get(id);if(!it||it.titleAuto!==true)return;
    await patch(id,{title:t.slice(0,120)});
    const el=$('d-title');if(el&&current===id&&document.activeElement!==el){el.value=t.slice(0,120);growTitle();}
    renderAll();
  }catch(e){}
}
function shareItem(it){
  if(!it)return;
  const lines=[it.title];if(it.summary&&it.summary.tese)lines.push(it.summary.tese);if(it.note)lines.push(it.note);
  const text=lines.join('\n\n');
  const extUrl=safeHttpUrl(it.url);
  if(navigator.share){const d={title:it.title,text};if(extUrl)d.url=extUrl;navigator.share(d).catch(()=>{});return;}
  copyText(text+(extUrl?'\n'+extUrl:''),'copiado para compartilhar.');
}

const ALLOWED_COLS=new Set(['items','wants','bodies','shelves']);
function sanitizeBackupRecord(col,rec){
  if(!rec||typeof rec!=='object'||Array.isArray(rec))return null;
  if(col==='bodies')return {text:String(rec.text||'')};
  if(col==='wants')return {text:String(rec.text||'').slice(0,500),createdAt:Number(rec.createdAt)||Date.now(),done:!!rec.done};
  if(col==='shelves')return {name:String(rec.name||'estante').slice(0,40),cor:CORES.includes(rec.cor)?rec.cor:CORES[0],order:Number(rec.order)||0,createdAt:Number(rec.createdAt)||Date.now()};
  const type=TYPE[rec.type]?rec.type:'outro';
  return {
    title:String(rec.title||'Sem título').slice(0,240),
    type,
    url:safeHttpUrl(rec.url),
    excerpt:String(rec.excerpt||'').slice(0,400),
    words:Math.max(0,Number(rec.words)||0),
    parts:Math.max(0,Number(rec.parts)||0),
    note:String(rec.note||''),
    createdAt:Number(rec.createdAt)||Date.now(),
    updatedAt:Number(rec.updatedAt)||Date.now(),
    day:/^\d{4}-\d{2}-\d{2}$/.test(String(rec.day||''))?rec.day:dayKey(),
    step:Math.max(0,Math.min(OFFSETS.length,Number(rec.step)||0)),
    due:rec.due&&/^\d{4}-\d{2}-\d{2}$/.test(String(rec.due))?rec.due:null,
    archived:!!rec.archived,
    done:!!rec.done,
    titleAuto:!!rec.titleAuto,
    manual:!!rec.manual,
    cor:CORES.includes(rec.cor)?rec.cor:undefined,
    shelves:Array.isArray(rec.shelves)?rec.shelves.map(String).filter(x=>/^[A-Za-z0-9_-]{1,40}$/.test(x)).slice(0,30):[],
    summary:cleanSummary(rec.summary)||undefined
  };
}
function mergeBackup(text){
  let o;try{o=JSON.parse(text);}catch(e){return -1;}
  const inc=o&&(o.app==='talse'||o.app==='stuff')&&o.data&&typeof o.data==='object'?o.data:null;if(!inc)return -1;
  let cur={};try{cur=JSON.parse(localStorage.getItem('bp:localdb')||'{}');}catch(e){}
  let add=0;
  for(const col of Object.keys(inc)){
    if(!ALLOWED_COLS.has(col))continue;
    const src=inc[col];if(!src||typeof src!=='object'||Array.isArray(src))continue;
    const dst=cur[col]&&typeof cur[col]==='object'?cur[col]:(cur[col]={});
    for(const id of Object.keys(src)){
      if(id==='__proto__'||id==='constructor'||id==='prototype'||id in dst)continue;
      const clean=sanitizeBackupRecord(col,src[id]);
      if(clean){dst[id]=clean;add++;}
    }
  }
  if(add){try{localStorage.setItem('bp:localdb',JSON.stringify(cur));localStorage.setItem('bp:localdb:v','1');}catch(e){return -2;}}
  return add;
}

function portaVoltar(silencio){
  const a=document.querySelector('#porta .livro3d');if(a)a.remove();
  const b=document.querySelector('#porta .term3d');if(b)b.remove();

function portaClique(el,ds){

  return false;
}

init();

  window.__talseBench=(n=60)=>{const gl=renderer.getContext();gl.finish();const t=performance.now();for(let i=0;i<n;i++)renderer.render(scene,cam);gl.finish();return +((performance.now()-t)/n).toFixed(2);};
  return {
    pause,resume,voltar,puxar,focarMonitor,entrar,chegou,
    refresh(){construirLivros();desenharTudo();rotulos.forEach(r=>r.el.innerHTML=r.html());},
    destroy(){pause();ro.disconnect();document.removeEventListener('visibilitychange',vis);window.removeEventListener('deviceorientation',ori);hots.innerHTML='';texturas.forEach(t=>t.dispose());renderer.dispose();}
  };
}
window.TalseScene={mount};
window.dispatchEvent(new Event('talse-scene'));
</script>
