<title>Talse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Talse v4: espaço. Regras em design-rules.md.
   Fonte do sistema, a mesma pilha do X (T7) + Geist Mono só no estilo terminal (T2).
   Dois temas: espaço (preto, padrão) e claro (branco com preto) (C5). Fundo vivo em degradê (C6). */
:root{
  --bg:#000000; --surf:#0B0D11; --surf2:#16181C; --ink:#E7E9EA; --ink2:#C9CDD1; --mut:#8B9298; --line:#202327; --line2:#2F3336;
  --sombra:0 0 0 1px var(--line);
  --sombra2:0 0 0 1px var(--line2),0 20px 50px -20px rgba(0,0,0,.9);
  --grao:0;
  --acc:#22C7F0; --acc-txt:#5AD8F7; --acc-on:#001A22; --acc-soft:color-mix(in srgb,var(--acc) 14%,transparent);
  --vidro:rgba(0,0,0,.62);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --raio:14px; --raio-bt:999px; --ease:cubic-bezier(.2,.7,.2,1); --mola:cubic-bezier(.34,1.4,.64,1);
  --nav-h:60px;
  --safe-b:max(4px,calc(env(safe-area-inset-bottom,0px) - 8px));
  --t-youtube:#8E2A2A; --t-instagram:#7A2E5C; --t-grok:#2D3036; --t-artigo:#2F5D46; --t-musica:#85590D;
  --t-ia:#3A3F8F; --t-conversa:#1F5A66; --t-busca:#A0462A; --t-video:#7B3B1E; --t-outro:#5E4B3A; --t-pagamento:#1B6E46;
  --letra:1;
  color-scheme:dark;
}
@media (display-mode:standalone){:root{--safe-b:max(6px,calc(env(safe-area-inset-bottom,0px) - 6px))}}
/* claro: branco com preto (cinzas do X) */
:root[data-cor="claro"]{
  --bg:#FFFFFF; --surf:#FFFFFF; --surf2:#F2F4F5; --ink:#0F1419; --ink2:#2F3336; --mut:#536471; --line:#EFF3F4; --line2:#CFD9DE;
  --sombra:0 0 0 1px var(--line2); --sombra2:0 0 0 1px var(--line2),0 20px 50px -24px rgba(15,20,25,.35);
  --acc-txt:#0A6E8A; --acc-on:#001A22; --vidro:rgba(255,255,255,.72); color-scheme:light}
/* destaque escolhido (C3): preenchimento vivo; texto claro no espaço, escuro no claro */
:root[data-acc="vermelho"]{--acc:#FF3D4F;--acc-txt:#FF7A86;--acc-on:#1A0004}
:root[data-acc="cobalto"]{--acc:#2B59FF;--acc-txt:#8FA6FF;--acc-on:#FFFFFF}
:root[data-acc="amarelo"]{--acc:#FFC83D;--acc-txt:#FFC83D;--acc-on:#1A1405}
:root[data-acc="verde"]{--acc:#2FA36B;--acc-txt:#4CCB8C;--acc-on:#04140C}
:root[data-cor="claro"][data-acc="vermelho"]{--acc-txt:#B4231D}
:root[data-cor="claro"][data-acc="cobalto"]{--acc-txt:#2448D8}
:root[data-cor="claro"][data-acc="amarelo"]{--acc-txt:#835C00}
:root[data-cor="claro"][data-acc="verde"]{--acc-txt:#1B6E46}
:root[data-letra="p"]{--letra:.92} :root[data-letra="g"]{--letra:1.12}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;overflow-x:clip;max-width:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
/* céu vivo (C6): canvas fixo atrás de tudo; sem WebGL, degradê CSS parado */
#ceu{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;opacity:0;transition:opacity 1.2s var(--ease)}
#ceu.on{opacity:1}
body.sem-ceu::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 80% at 20% 0%,color-mix(in srgb,var(--acc) 22%,var(--bg)),transparent 60%),radial-gradient(90% 70% at 100% 100%,color-mix(in srgb,#6A3CFF 16%,var(--bg)),transparent 60%)}
body.abrindo #ceu{z-index:94}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--acc-txt)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--acc) 26%,transparent)}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:600;letter-spacing:-.015em;text-wrap:balance;font-variation-settings:"SOFT" 50,"WONK" 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ícones duotom: traço na cor do texto, preenchimento suave na cor do tipo ou do destaque */
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.i .d{fill:var(--ic,var(--acc));fill-opacity:.22;stroke:none}
svg.i .s{fill:currentColor;stroke:none}
svg.i .mv{transition:transform .35s var(--mola);transform-box:fill-box}
button:active svg.i .mv,a:active svg.i .mv,.vivo svg.i .mv{transform:var(--mv,translateY(-2px) rotate(-8deg))}

.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + var(--safe-b) + 32px)}
body.has-mini .wrap{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 90px)}

/* Topo: marca em Fraunces com WONK, ações à direita */
.topo{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.marca{display:inline-flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:0;color:var(--ink);font-family:var(--fd);font-size:25px;font-weight:700;letter-spacing:-.03em;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 72}
.marca .selo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--acc);color:var(--acc-on)}
.marca .selo svg.i{width:19px;height:19px;stroke-width:1.9}
.marca .selo svg.i .d{fill:var(--acc-on);fill-opacity:.3}
.topo-r{display:flex;align-items:center;gap:2px}
.ic{position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--ink2);flex:none;text-decoration:none;transition:background .2s,color .2s,transform .2s var(--mola)}
.ic:hover{color:var(--ink);background:var(--surf2)}
.ic:active{transform:scale(.9)}
.ic:disabled{opacity:.35;cursor:default}
.ic[aria-pressed="true"]{color:var(--acc-txt)}
.banner{border-left:3px solid var(--acc);padding:8px 12px;margin:10px 0;font-size:14px;color:var(--ink2);background:var(--surf);border-radius:0 var(--raio) var(--raio) 0}

/* ---------- Início: a mesa ---------- */
.mesa{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-top:6px}
.saud{font-family:var(--fd);font-size:clamp(1.9rem,7.4vw,2.9rem);line-height:1.02;font-weight:600;letter-spacing:-.035em;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;margin:4px 0 0}
.saud em{font-style:normal;color:var(--acc-txt)}
.carimbos{display:flex;flex-wrap:wrap;gap:8px}
.carimbo{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:12px;border:1.5px dashed var(--line2);background:transparent;color:var(--ink2);font-size:14px;font-weight:500;transition:transform .25s var(--mola),border-color .2s,background .2s}
.carimbo b{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--ink);font-variation-settings:"opsz" 48}
.carimbo:hover{border-color:var(--ink2);transform:rotate(-1.5deg)}
.carimbo.due{border:1.5px solid var(--acc);color:var(--acc-txt);background:var(--acc-soft)}
.carimbo.due b{color:var(--acc-txt)}

/* Tira de papel: colar um link guarda direto, sem botão de abrir */
.tira{position:relative;display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 6px 6px 14px;background:var(--surf);border-radius:4px;box-shadow:var(--sombra);transform:rotate(-.4deg);transition:transform .3s var(--mola),box-shadow .3s}
.tira::before,.tira::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:radial-gradient(circle at 0 50%,var(--bg) 4px,transparent 4.5px) 0 0/10px 14px repeat-y}
.tira::before{left:-5px}
.tira::after{right:-5px;transform:scaleX(-1)}
.tira:focus-within{transform:rotate(0) translateY(-2px);box-shadow:var(--sombra2)}
.tira svg.i{color:var(--acc-txt)}
.tira input{flex:1;min-width:0;border:0;background:none;outline:none;padding:10px 0;font-family:var(--fd);font-size:17px;font-variation-settings:"opsz" 18}
.tira input::placeholder{color:var(--mut);font-style:normal}
.tira .go{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:var(--acc);color:var(--acc-on);flex:none;transition:transform .25s var(--mola)}
.tira .go:active{transform:scale(.88) rotate(-12deg)}
.tira .go svg.i{color:var(--acc-on)}
.tira .go svg.i .d{fill:var(--acc-on)}

/* Livro aberto com o próximo item */
.aberto{position:relative;display:grid;grid-template-columns:1fr;background:var(--surf);border-radius:6px 14px 14px 6px;box-shadow:var(--sombra2);overflow:hidden}
.aberto::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--lomb,var(--acc))}
.aberto .pg{padding:20px 20px 18px 26px;display:grid;gap:10px;min-width:0}
.fita{position:absolute;top:-4px;right:22px;width:16px;height:46px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);transition:height .35s var(--mola)}
.aberto:hover .fita{height:56px}
.kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kicker .por{color:var(--acc-txt)}
.next-open{background:none;border:0;padding:0;text-align:left;display:grid;gap:6px;min-width:0;color:inherit}
.next-title{font-family:var(--fd);font-size:clamp(1.35rem,4.6vw,1.85rem);line-height:1.15;font-weight:600;letter-spacing:-.02em;font-variation-settings:"opsz" 72,"SOFT" 30;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.next-excerpt{font-family:var(--fd);font-size:15.5px;line-height:1.55;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin:0;font-variation-settings:"opsz" 14}
.next-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.vazio-mesa{font-family:var(--fd);font-size:18px;color:var(--mut);margin:0}

.sec-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:28px 0 10px}
.sec-lbl h2{font-size:20px;font-variation-settings:"opsz" 36}
.linkbtn{background:none;border:0;padding:0;color:var(--acc-txt);font-size:14px;font-weight:600;position:relative}
.linkbtn::after,.meta a::after,.toast button::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:44px;transform:translateY(-50%)}
.linkbtn[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- Botões ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:var(--raio-bt);border:1.5px solid var(--line2);background:var(--surf);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);transition:transform .2s var(--mola),border-color .2s,box-shadow .2s;box-shadow:0 1px 0 var(--line2)}
.btn:hover{border-color:var(--ink2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:none}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.btn.pri svg.i .d{fill:var(--bg)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-on);box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 65%,#000)}
.btn.acc svg.i .d{fill:var(--acc-on)}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:0 13px;font-size:13.5px}
.btn svg.i{width:18px;height:18px}

/* ---------- Fichas de catálogo ---------- */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ficha{position:relative;display:flex;align-items:center;gap:2px;background:var(--surf);border-radius:4px 12px 12px 4px;box-shadow:var(--sombra);touch-action:pan-y;transition:transform .3s var(--mola),box-shadow .25s;flex-wrap:wrap;padding-left:10px}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:var(--lomb)}
.ficha:hover{transform:translateX(3px);box-shadow:var(--sombra2)}
.ficha.arrasta{transition:none}
.ficha .rastro{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:14px;pointer-events:none;opacity:0}
.row{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px 14px 6px;color:inherit}
.tipo-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--lomb) 14%,transparent);color:var(--ink);flex:none;--ic:var(--lomb)}
.tipo-ic svg.i{width:19px;height:19px}
.tipo-ic svg.i .d{fill-opacity:.45}
.rmain{display:grid;gap:4px;min-width:0;flex:1}
.rtitle{font-family:var(--fd);font-weight:600;font-size:calc(16.5px*var(--letra));line-height:1.3;letter-spacing:-.01em;font-variation-settings:"opsz" 24;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{color:var(--mut);font-size:13px;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.selo-dia{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border:1.2px solid var(--line2);border-radius:4px;padding:0 5px;transform:rotate(-2deg)}
.tag{font-weight:700;color:var(--acc-txt)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding:0 12px 14px 54px}
.empty{color:var(--mut);padding:26px 0;margin:0;font-family:var(--fd);font-size:17px}
.plats{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;width:100%;padding:0 12px 14px}
.plats::-webkit-scrollbar{display:none}

/* Capas (grade de livros) */
.capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px;list-style:none;margin:0;padding:0}
.capa{position:relative;aspect-ratio:2/3;border:0;border-radius:3px 9px 9px 3px;background:var(--lomb);color:#FBF5E8;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),inset 8px 0 0 rgba(255,255,255,.07),var(--sombra2);transition:transform .35s var(--mola);overflow:hidden;width:100%}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-100%);transition:transform .7s var(--ease)}
.capa:hover{transform:translateY(-6px) rotate(-1.2deg)}
.capa:hover::after{transform:translateX(100%)}
.capa .ct{font-family:var(--fd);font-size:17px;line-height:1.15;font-weight:650;font-variation-settings:"opsz" 30,"SOFT" 60;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.capa .cm{display:flex;align-items:center;justify-content:flex-start;gap:6px;padding-right:16px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.capa svg.i{width:18px;height:18px;--ic:#FBF5E8}
.capa .fitinha{position:absolute;top:0;right:14px;width:11px;height:30px;background:#F2D45C;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}

/* Estante (lombadas) */
.estante{display:grid;gap:26px}
.prateleira h3{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:8px}
.prateleira h3 small{font-family:var(--f);font-size:12px;font-weight:700;color:var(--mut)}
.lombadas{--tabua:color-mix(in srgb,var(--ink) 24%,var(--bg));display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px 3px;padding:0 6px;background:repeating-linear-gradient(to bottom,transparent 0 196px,var(--tabua) 196px 208px,transparent 208px 216px)}
.lombada{flex:none;width:calc(44px + var(--w,0px));height:var(--h,180px);margin-top:calc(196px - var(--h,180px));border:0;border-radius:3px 3px 0 0;background:var(--lomb);color:#FBF5E8;writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 0;font-family:var(--fd);font-size:14px;font-weight:600;line-height:1.1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:inset -3px 0 0 rgba(0,0,0,.2),inset 3px 0 0 rgba(255,255,255,.08);transition:transform .3s var(--mola);position:relative}
.lombada::before,.lombada::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:rgba(242,212,92,.65)}
.lombada::before{top:8px}.lombada::after{bottom:8px}
.lombada:hover{transform:rotate(180deg) translateY(10px)}

/* ---------- Abas e chips ---------- */
.abas{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding:2px 1px 6px}
.abas::-webkit-scrollbar{display:none}
.aba{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;border:1.5px solid transparent;background:none;color:var(--mut);padding:0 12px;font-size:14px;font-weight:600;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.aba svg.i{width:17px;height:17px}
.aba[aria-selected="true"]{color:var(--ink);background:var(--surf);border-color:var(--line2);box-shadow:var(--sombra)}
.busca{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:999px;padding:0 6px 0 16px;background:var(--surf);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.busca svg.i{color:var(--mut)}
.busca input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;outline:none}
.busca input::placeholder{color:var(--mut)}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surf);color:var(--ink2);font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;transition:transform .2s var(--mola)}
.chip:active{transform:scale(.95)}
.chip svg.i{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] svg.i .d{fill:var(--bg)}
.chip .bol{width:12px;height:12px;border-radius:50%;background:var(--lomb,var(--acc));flex:none}
.rolo{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding:2px}
.rolo::-webkit-scrollbar{display:none}
.ferramentas{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}
.modos{display:inline-flex;gap:2px;background:var(--surf2);border-radius:999px;padding:3px}
.modos .ic{width:44px;height:44px;border-radius:999px}
.modos .ic[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--sombra)}

/* ---------- Títulos de seção ---------- */
.vt{font-size:clamp(2rem,6vw,2.6rem);line-height:1.02;letter-spacing:-.035em;margin:10px 0 14px;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144}
.vt sup{font-family:var(--f);font-size:14px;font-weight:700;color:var(--acc-txt);margin-left:6px;vertical-align:super;letter-spacing:0}
h3.dia{font-family:var(--f);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}

/* ---------- Barra inferior com marcador que desliza ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(var(--safe-b) + 6px) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.nav-in{position:relative;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--sombra2);height:var(--nav-h);pointer-events:auto}
.marcador{position:absolute;top:-1px;left:0;width:20%;height:6px;display:flex;justify-content:center;transition:transform .45s var(--mola);pointer-events:none}
.marcador::before{content:"";width:22px;height:14px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:var(--nav-h);min-height:44px;background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;min-width:0;padding:0 2px}
.tab svg.i{width:22px;height:22px;transition:transform .35s var(--mola)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg.i{transform:translateY(-1px) scale(1.08)}
.tab[aria-current="page"] svg.i .d{fill-opacity:.4}
.tab .n{position:absolute;top:7px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--acc);color:var(--acc-on);font-size:12px;font-weight:700;line-height:18px;text-align:center}
/* selo de cera: guardar */
.mais{justify-self:center;position:relative;display:grid;place-items:center;width:52px;height:52px;margin-top:-22px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-on);box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000),0 10px 22px -6px color-mix(in srgb,var(--acc) 70%,transparent);transition:transform .3s var(--mola)}
.mais::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--acc-on) 55%,transparent)}
.mais svg.i{width:24px;height:24px;stroke-width:2.2}
.mais svg.i .d{fill:var(--acc-on)}
.mais:hover{transform:rotate(-10deg) scale(1.04)}
.mais:active{transform:scale(.9) rotate(8deg)}

.mini{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:19;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.mini-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:2px;height:56px;background:var(--ink);color:var(--bg);border-radius:16px;padding:0 6px;box-shadow:var(--sombra2)}
.mini-in .ic{color:var(--bg)}
.mini-in .ic:hover{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.mini-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0 8px;display:grid;color:var(--bg)}
.mini-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--fd);font-weight:600;font-size:15px}
.mini-title small{font-size:12px;opacity:.85}

/* ---------- Máquina de escrever (guardar) ---------- */
.drawer{position:fixed;inset:0;height:100dvh;z-index:35;background:color-mix(in srgb,var(--bg) 62%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;overscroll-behavior:contain;display:flex;align-items:flex-start;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px}
.drawer-in{width:100%;max-width:640px;display:grid;gap:12px}
.maquina{position:relative;background:var(--surf);border-radius:6px;padding:18px 16px 14px;box-shadow:var(--sombra2);display:grid;gap:12px}
.maquina::before{content:"";position:absolute;left:14px;right:14px;top:-9px;height:12px;border-radius:6px 6px 0 0;background:var(--ink);opacity:.85}
.drawer-top{display:flex;align-items:center;justify-content:space-between}
.drawer-top b{font-family:var(--fd);font-size:24px;font-weight:650;letter-spacing:-.02em;font-variation-settings:"WONK" 1,"SOFT" 100}
.drawer textarea{width:100%;min-height:96px;max-height:34dvh;resize:none;font-family:var(--fd);font-size:18px;line-height:1.5;border:0;border-bottom:1.5px dashed var(--line2);border-radius:0;padding:6px 2px 10px;background:repeating-linear-gradient(transparent 0 26px,color-mix(in srgb,var(--line2) 60%,transparent) 26px 27px);font-variation-settings:"opsz" 18}
.drawer textarea:focus{outline:none;border-bottom-color:var(--acc)}
.drawer textarea::placeholder{color:var(--mut)}
.drawer-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.envelope{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 40px);z-index:46;width:150px;height:96px;margin-left:-75px;pointer-events:none}
.envelope .ev{position:absolute;inset:0;background:var(--surf2);border:1.5px solid var(--line2);border-radius:6px;box-shadow:var(--sombra2)}
.envelope .ev::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:var(--surf);clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:1px solid var(--line2);transform-origin:top;transition:transform .35s var(--ease)}
.envelope .cartao{position:absolute;left:12px;right:12px;bottom:30px;height:86px;background:var(--bg);border:1px solid var(--line2);border-left:5px solid var(--lomb,var(--acc));border-radius:3px;padding:8px;font-family:var(--fd);font-size:12px;line-height:1.2;color:var(--ink);overflow:hidden}
.envelope.fecha .cartao{animation:entra .55s var(--ease) forwards}
.envelope.fecha .ev::before{transform:scaleY(1)}
@keyframes entra{to{transform:translateY(60px);opacity:.0}}
@keyframes envelopa{0%{opacity:0;transform:translateY(30px) scale(.9)}15%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px) rotate(-8deg) scale(.8)}}
.envelope{animation:envelopa 1.6s var(--ease) forwards}

/* ---------- Leitor: página de livro ---------- */
.sheet{position:fixed;inset:0;height:100dvh;z-index:30;background:var(--bg);overflow-y:auto;overflow-x:clip;overscroll-behavior:contain}
.sheet-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sin{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-top .sin{display:flex;align-items:center;gap:4px}
.sheet-top .abas{flex:1;justify-content:flex-end;padding:4px 1px}
.sheet-body{position:relative;padding-block:22px calc(56px + env(safe-area-inset-bottom,0px))}
.sheet-body::before{content:"";position:absolute;left:max(4px,env(safe-area-inset-left,0px));top:22px;width:5px;height:120px;border-radius:3px;background:var(--lomb,var(--acc))}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--mut);font-size:13.5px}
.meta select{min-height:44px;border:0;border-bottom:1.5px solid var(--line2);border-radius:0;background:transparent;padding:0 4px 0 0;font-size:16px;font-weight:600;color:var(--ink2);max-width:100%}
.meta a{display:inline-flex;align-items:center;gap:5px;font-weight:600;text-decoration:none;position:relative}
.meta a svg.i{width:16px;height:16px}
.d-title{display:block;width:100%;margin:12px 0 0;border:0;border-bottom:1.5px solid transparent;background:none;resize:none;overflow:hidden;font-family:var(--fd);font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.12;font-weight:600;letter-spacing:-.025em;padding:0 0 4px;overflow-wrap:anywhere;font-variation-settings:"opsz" 96,"SOFT" 40}
.d-title:focus{outline:none;border-bottom-color:var(--line2)}
.resumo{position:relative;margin:20px 0 0;padding:16px 18px 18px;background:var(--surf);border-radius:4px;box-shadow:var(--sombra);max-width:65ch;transform:rotate(-.3deg)}
.resumo::before{content:"";position:absolute;top:-8px;left:50%;width:70px;height:18px;margin-left:-35px;background:color-mix(in srgb,#F2D45C 70%,transparent);transform:rotate(2deg)}
.resumo .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.resumo .tese{margin:0 0 8px;font-family:var(--fd);font-size:19px;line-height:1.45;font-weight:600}
.resumo ul{margin:0;padding-left:1.1em;color:var(--ink2);font-size:15.5px;line-height:1.6}
.resumo li+li{margin-top:3px}
.resumo .mut{font-size:14px;margin:0;color:var(--mut)}
.reading{margin-top:24px;font-family:var(--fd);font-size:calc(19px*var(--letra));line-height:1.68;max-width:65ch;overflow-wrap:anywhere;font-variation-settings:"opsz" 16}
.reading>p:first-child::first-letter{float:left;font-size:3.4em;line-height:.85;padding:6px 8px 0 0;font-weight:700;color:var(--acc-txt);font-variation-settings:"opsz" 144,"WONK" 1}
.reading p{margin:0 0 1.05em;text-wrap:pretty}
.reading h3{font-size:1.15em;line-height:1.3;margin:1.5em 0 .5em}
.reading ul,.reading ol{margin:0 0 1.05em;padding-left:1.2em}
.reading li+li{margin-top:.25em}
.reading code{font-family:ui-monospace,Consolas,monospace;font-size:.8em;background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.revisao{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px;padding:14px 16px;background:var(--surf);border-radius:var(--raio);box-shadow:var(--sombra);font-size:14.5px;font-weight:600}
.field{display:grid;gap:6px;font-size:13.5px;color:var(--mut);font-weight:600}
.field>span{display:flex;justify-content:space-between;gap:8px}
.field output{color:var(--ink);font-weight:700}
.field select,.field textarea,.field input[type=date],.field input[type=text]{width:100%;max-width:100%;border:1.5px solid var(--line2);border-radius:var(--raio);background:var(--surf);color:var(--ink);font-size:16px}
.field select,.field input[type=date],.field input[type=text]{min-height:46px;padding:0 10px}
.field textarea{min-height:220px;padding:14px;line-height:1.6;resize:vertical;font-family:var(--fd);background:repeating-linear-gradient(var(--surf) 0 27px,var(--line) 27px 28px);background-attachment:local}
input[type=range]{width:100%;accent-color:var(--acc);min-height:28px}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;min-height:44px}
.check input,.direto input{-webkit-appearance:none;appearance:none;position:relative;flex:none;width:44px;height:44px;margin:0 -2px 0 -6px;background:none;border:0;cursor:pointer}
.check input::before,.direto input::before{content:"";position:absolute;left:3px;top:11px;width:38px;height:22px;border-radius:11px;background:var(--line2);transition:background .2s}
.check input::after,.direto input::after{content:"";position:absolute;left:6px;top:14px;width:16px;height:16px;border-radius:50%;background:#FBF7EE;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--mola)}
.check input:checked::before{background:var(--acc)}
.direto input:checked::before{background:#F2D45C}
.check input:checked::after,.direto input:checked::after{transform:translateX(16px)}
.check input:focus-visible,.direto input:focus-visible{outline:2px solid var(--acc);outline-offset:-4px;border-radius:14px}
.player{display:grid;gap:18px;margin-top:22px}
.now{font-family:var(--fd);font-size:20px;line-height:1.6;min-height:3.4em;max-width:65ch;overflow-wrap:anywhere}
.track{height:4px;border-radius:2px;background:var(--line2)}
.track i{display:block;height:4px;border-radius:2px;width:0;background:var(--acc)}
.pinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}
.pctl{display:flex;align-items:center;justify-content:center;gap:12px}
/* fita cassete: o botão de tocar gira as bobinas */
.playbig{position:relative;display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);box-shadow:var(--sombra2);transition:transform .25s var(--mola)}
.playbig svg.i{width:28px;height:28px;stroke-width:2}
.playbig svg.i .d{fill:var(--bg)}
.playbig:active{transform:scale(.92)}
.pane-pad{margin-top:20px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.state{color:var(--mut);font-size:13.5px;margin:8px 0 0;min-height:1.2em}
.lg{display:inline-flex;gap:14px;align-items:center}

/* ---------- Folhas de escolha (lembrar, ajustes, menu do item) ---------- */
.folha{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,#000 34%,transparent)}
.folha-in{width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);display:grid;gap:14px}
.folha-in::before{content:"";justify-self:center;width:44px;height:5px;border-radius:3px;background:var(--line2)}
.folha-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.folha-top b{font-family:var(--fd);font-size:24px;font-weight:650;letter-spacing:-.02em;font-variation-settings:"WONK" 1,"SOFT" 100}
.opcoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opcao{position:relative;display:grid;gap:4px;align-content:start;min-height:76px;padding:12px 14px;border:1.5px solid var(--line2);border-radius:14px;background:var(--surf);text-align:left;color:var(--ink);transition:transform .25s var(--mola),border-color .2s}
.opcao:hover{transform:translateY(-2px);border-color:var(--ink2)}
.opcao[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.opcao svg.i{width:24px;height:24px;color:var(--ink)}
.opcao b{font-weight:700;font-size:14.5px}
.opcao small{color:var(--mut);font-size:12.5px}
.grupo{display:grid;gap:8px}
.grupo>span{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.amostras{display:flex;flex-wrap:wrap;gap:10px}
.amostra{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--line2);background:var(--c);transition:transform .25s var(--mola)}
.amostra[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.08);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.papel-op{display:grid;justify-items:center;gap:4px;min-width:72px;min-height:44px;border:0;background:none;padding:0;color:var(--ink2);font-size:12.5px;font-weight:600}
.papel-op i{display:block;width:72px;height:52px;border-radius:12px;border:2px solid var(--line2);box-shadow:var(--sombra);transition:transform .25s var(--mola)}
.papel-op[aria-pressed="true"] i{border-color:var(--ink);transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.papel-op[aria-pressed="true"]{color:var(--ink)}
.seg{display:inline-flex;gap:2px;background:var(--surf2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:56px;padding:0 14px;border:0;border-radius:999px;background:none;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--sombra)}
.est-lista{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.est-lista li{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 12px;background:var(--surf);border-radius:12px;box-shadow:var(--sombra);touch-action:none}
.est-lista li.pega{opacity:.6;transform:scale(1.02)}
.est-lista .alca{cursor:grab;color:var(--mut)}
.est-lista .nome{flex:1;min-width:0;font-family:var(--fd);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-nova{display:flex;gap:8px}
.est-nova input{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--line2);border-radius:999px;padding:0 16px;background:var(--surf)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:80;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:500;box-shadow:var(--sombra2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px 0;flex:none;position:relative}
body.has-mini .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 80px)}

/* ---------- Abertura curta (quando a sala 3D está desligada) ---------- */
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .22s var(--ease),transform .24s var(--ease)}
.splash.out{opacity:0;transform:translateY(-8px);pointer-events:none}
.booksvg{width:84px;height:84px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.booksvg .ln{stroke:var(--acc);stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s var(--ease) forwards}
.booksvg .l2{animation-delay:.12s}
.booksvg .l3{animation-delay:.22s;stroke:var(--ink)}
.sw{font-family:var(--fd);font-size:34px;font-weight:700;letter-spacing:-.04em;color:var(--ink);opacity:0;animation:fade .3s var(--ease) .25s forwards;font-variation-settings:"WONK" 1,"SOFT" 100,"opsz" 144}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes folhear{from{opacity:.2;transform:perspective(1400px) rotateY(-14deg);transform-origin:left center}to{opacity:1;transform:none}}
@keyframes folhearVolta{from{opacity:.2;transform:perspective(1400px) rotateY(14deg);transform-origin:right center}to{opacity:1;transform:none}}
@keyframes pagina{from{opacity:0;transform:perspective(1600px) rotateY(32deg) translateX(30px);transform-origin:right center}to{opacity:1;transform:none}}

/* ---------- Sala 3D (porta de entrada) ---------- */
.porta{position:fixed;inset:0;z-index:70;background:#1A140F;color:#F4EBDA;overflow:hidden;font-family:var(--f);--acc-on:#FCF7EE}
.porta{transition:opacity .38s var(--ease)}
.porta.sai{opacity:0}
.porta canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s var(--ease);touch-action:none}
.porta.viva canvas{opacity:1}
.porta.viva .poster{opacity:0;pointer-events:none}
.poster{position:absolute;inset:0;transition:opacity .6s var(--ease);background:radial-gradient(ellipse at 30% 45%,#4A3522 0,#22191199 45%,transparent 70%),linear-gradient(#1F2A23,#141A16 62%,#2A1C12 62.2%,#1E150E);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:18px;padding:80px 16px 150px;overflow-y:auto}
.p-parede{display:flex;align-items:flex-end;gap:2px;height:120px;max-width:min(560px,100%);overflow:hidden;padding:0 8px;border-bottom:10px solid #4A311E;box-shadow:0 12px 16px -8px rgba(0,0,0,.6)}
.p-parede button{flex:none;width:calc(20px + var(--w,0px));height:var(--h,100px);border:0;border-radius:2px 2px 0 0;background:var(--lomb);box-shadow:inset -2px 0 0 rgba(0,0,0,.25);transition:transform .25s var(--mola);padding:0}
.p-parede button:hover{transform:translateY(-8px)}
.p-mesa{position:relative;width:min(560px,100%);display:grid;justify-items:center}
.p-mon{width:min(440px,92%);background:#121212;border-radius:12px;padding:12px;box-shadow:0 24px 40px -10px rgba(0,0,0,.7),inset 0 0 0 1px #2a2a2a}
.p-tela{background:#0E1612;border-radius:4px;padding:12px 14px;min-height:190px;display:grid;gap:8px;align-content:start;color:#DCEFE3;box-shadow:inset 0 0 30px rgba(90,200,140,.12)}
.p-tela .bar{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9FC3AD}
.p-tela .bar i{width:9px;height:9px;border-radius:50%;background:#3C4A42}
.p-tela ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.p-tela li button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:0;background:none;color:#DCEFE3;text-align:left;padding:0 4px;border-radius:6px;font-size:14px}
.p-tela li button:hover{background:#1A2620}
.p-tela li i{width:10px;height:10px;border-radius:50%;background:var(--lomb);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.p-tela li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-tela li small{color:#9FC3AD;font-size:12px;flex:none}
.p-pe{width:90px;height:34px;background:linear-gradient(#2a2a2a,#151515);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.p-tampo{width:100%;height:18px;border-radius:4px;background:linear-gradient(#6B4529,#4A2F1B);box-shadow:0 14px 24px -6px rgba(0,0,0,.7)}
.p-postit{position:relative;justify-self:end;margin:-26px 6% 0 0;width:92px;min-height:88px;border:0;background:#F2D45C;color:#2A2208;transform:rotate(5deg);box-shadow:0 8px 14px -6px rgba(0,0,0,.6);font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.1;padding:10px 8px;text-align:left;transition:transform .25s var(--mola)}
.p-postit b{display:block;font-size:30px}
.p-postit:hover{transform:rotate(0) scale(1.05)}
.termo{display:flex;align-items:center;gap:8px;border-top:1px solid #24352C;padding-top:8px;margin-top:2px}
.termo label{color:#7FD3A3;font-family:ui-monospace,Consolas,monospace;font-size:16px;flex:none}
.termo input{flex:1;min-width:0;min-height:44px;border:0;background:none;color:#EAF7EF;font-family:ui-monospace,Consolas,monospace;font-size:16px;outline:none;caret-color:#7FD3A3}
.termo input::placeholder{color:#8FB39E}
.termo button{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:#7FD3A3;color:#0E1612;font-weight:700}
/* terminal flutuante alinhado ao monitor 3D */
.term3d{position:absolute;z-index:3;background:#0E1612F2;border-radius:6px;padding:10px 12px;box-shadow:0 0 0 1px #24352C,0 0 40px rgba(90,200,140,.18);color:#DCEFE3;display:grid;gap:8px;animation:fade .3s var(--ease)}
.term3d .bar{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9FC3AD}
.term3d .bar button{width:44px;height:44px;border:0;background:none;color:#DCEFE3;display:grid;place-items:center;border-radius:8px}
.term3d .bar button:hover{background:#1A2620}
/* rótulos que seguem os objetos da sala */
#hots{position:absolute;inset:0;z-index:2;pointer-events:none}
#hots .hot{pointer-events:auto}
.porta.foco #hots{opacity:0;pointer-events:none}
.porta.foco .porta-pe{opacity:0;pointer-events:none}
.porta-pe{transition:opacity .3s}
.porta.foco #hots .hot{pointer-events:none}
.hot{position:absolute;z-index:2;left:0;top:0;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px 0 10px;border:1px solid rgba(255,240,215,.28);border-radius:999px;background:#1A140FD9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#F4EBDA;font-size:14px;font-weight:600;white-space:nowrap;transform:translate(-50%,-50%);transition:opacity .3s,background .2s;will-change:left,top}
.hot::before{content:"";width:9px;height:9px;border-radius:50%;background:#F2D45C;box-shadow:0 0 0 0 rgba(242,212,92,.7);animation:pulso 2s infinite}
.hot:hover{background:#2A2017F2}
.hot b{color:#F2D45C}
@keyframes pulso{70%{box-shadow:0 0 0 10px rgba(242,212,92,0)}100%{box-shadow:0 0 0 0 rgba(242,212,92,0)}}
.porta-topo{position:absolute;z-index:4;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.porta-topo>*{pointer-events:auto}
.porta-marca{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:-.04em;font-variation-settings:"WONK" 1,"SOFT" 100,"opsz" 144;color:#F4EBDA}
.porta-marca small{display:block;font-family:var(--f);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#CDBB9C}
.porta-pe{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(transparent,#1A140FCC 40%)}
.porta-pe>*{pointer-events:auto}
.entrar{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px 0 20px;border:0;border-radius:999px;background:#F4EBDA;color:#1A140F;font-weight:700;font-size:16px;box-shadow:0 10px 30px -8px rgba(0,0,0,.7);transition:transform .25s var(--mola)}
.entrar:hover{transform:translateY(-2px)}
.entrar svg.i{--ic:#A3311F}
.direto{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:#E6D9C2}
.direto input::before{background:#5A4A38}
.livro3d{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:70px 14px 110px;background:#0d0a07a6;animation:fade .25s var(--ease)}
.livro3d .sp{position:relative;display:grid;grid-template-columns:1fr;width:min(720px,100%);max-height:100%;overflow:auto;background:#F6EEDC;color:#22190F;border-radius:6px;box-shadow:0 30px 60px -10px rgba(0,0,0,.8);animation:pagina .55s var(--ease)}
.livro3d .esq{padding:22px 22px 18px;background:var(--lomb);color:#FBF5E8;display:grid;gap:10px;align-content:space-between}
.livro3d .esq h3{font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.12;color:#FBF5E8;overflow-wrap:anywhere}
.livro3d .esq small{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.livro3d .dir{padding:56px 22px 22px;display:grid;gap:12px;align-content:start;font-family:var(--fd);font-size:16.5px;line-height:1.55}
.livro3d .dir p{margin:0;color:#3B2F22}
.livro3d .dir .btn{font-family:var(--f);background:#FBF7EE;color:#22190F;border-color:#CDBFA6}
.livro3d .dir .btn.pri{background:#22190F;color:#F6EEDC;border-color:#22190F}
.livro3d .fechar{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.25);color:#FBF5E8;display:grid;place-items:center}
@media (min-width:640px){.livro3d .sp{grid-template-columns:1fr 1.25fr}.livro3d .esq{min-height:320px}}

@media (prefers-reduced-motion:no-preference){
  section[data-view]:not([hidden]){animation:folhear .38s var(--ease)}
  body[data-dir="volta"] section[data-view]:not([hidden]){animation:folhearVolta .38s var(--ease)}
  .sheet:not([hidden]){animation:fade .22s var(--ease)}
  .drawer:not([hidden]) .drawer-in{animation:drop .28s var(--mola)}
  .folha:not([hidden]) .folha-in{animation:subir .32s var(--ease)}
  .toast{animation:rise .22s var(--mola)}
  .track i{transition:width .24s var(--ease)}
  .ficha,.capa,.lombada{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
}
.shelf{display:none}
/* Paisagem no celular */
@media (orientation:landscape) and (max-height:500px){
  :root{--nav-h:48px}
  .topo{min-height:46px}
  .tab{flex-direction:row;gap:5px}
  .tab .n{position:static;margin-left:2px}
  .mais{width:44px;height:44px;margin-top:0}
  .mesa{gap:12px}
  .saud{font-size:1.7rem}
  .drawer textarea{min-height:64px;max-height:42dvh}
  .poster{padding:60px 16px 90px;gap:8px}
  .p-parede{height:70px}
  .p-tela{min-height:120px}
}
/* Computador: mesa em duas colunas e estante por tipo */
@media (min-width:900px){
  .wrap{max-width:1120px}
  section:not([data-view="fila"])>*{max-width:780px;margin-left:auto;margin-right:auto}
  .topo{max-width:1120px}
  .mesa{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;column-gap:32px}
  .mesa .saud,.mesa .carimbos{grid-column:1/-1}
  .vitrine{grid-row:3}
  .aberto{grid-column:1;grid-row:4/span 2}
  .tira{grid-column:2;grid-row:4}
  .shelf{display:block;margin-top:10px}
  .shelf .lombadas{min-height:210px}
}

/* ===== Rodada stripe.press + ficha que leva ao conteúdo + papel que desdobra (design-rules T1 T2 T4 I3 K3 K4 K9 M2) ===== */
:root{--fs:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fm:"Geist Mono",ui-monospace,Consolas,monospace}
.mono{font-family:var(--fm);font-weight:500;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.saud{font-family:var(--fs);font-weight:400;font-size:clamp(2.5rem,10vw,4.4rem);line-height:.95;letter-spacing:-.02em;font-variation-settings:normal}
.saud em{font-style:italic}
.vt{font-family:var(--fs);font-weight:400;font-size:clamp(2.6rem,9vw,3.6rem);letter-spacing:-.02em;line-height:.95;font-variation-settings:normal}
.vt sup{font-family:var(--fm);font-size:13px;font-weight:500}
.marca{font-family:var(--fs);font-weight:400;font-size:30px;letter-spacing:-.02em;font-variation-settings:normal}
.carimbo{border-style:solid;border-width:1px;border-radius:8px;padding:0 14px 0 10px;gap:10px}
.carimbo b{font-family:var(--fs);font-weight:400;font-size:28px;line-height:1;font-variation-settings:normal}
.carimbo span{font-family:var(--fm);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.carimbo.due{border-width:1.5px}
.sec-lbl .linkbtn{display:inline-flex;align-items:center;min-height:44px}
.sec-lbl h2{font-family:var(--fm);font-weight:500;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.kicker{font-family:var(--fm);font-weight:500;letter-spacing:.05em}
.next-title{font-family:var(--fs);font-weight:400;font-size:clamp(1.9rem,6.4vw,2.6rem);line-height:1.02;letter-spacing:-.015em;font-variation-settings:normal}
.tab{font-family:var(--fm);font-weight:500;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.capa .ct{font-family:var(--fs);font-weight:400;font-size:22px;line-height:1.02;font-variation-settings:normal}
.capa .cm{font-family:var(--fm);font-weight:500}
.drawer-top b,.folha-top b{font-family:var(--fs);font-weight:400;font-size:30px;font-variation-settings:normal}
h3.dia,.grupo>span,.resumo .lbl{font-family:var(--fm);font-weight:500}
.formato{font-family:var(--fs);font-style:italic;font-size:.42em;font-weight:400;vertical-align:super;margin-left:4px;letter-spacing:0;color:var(--mut)}
/* carrossel de títulos */
.vitrine{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0;max-width:100%;overflow:hidden;contain:inline-size}
.carimbos,.tira,.aberto,.saud{min-width:0;max-width:100%}
.saud{overflow-wrap:anywhere}
.vit-trilho{position:relative;overflow:hidden;margin:0 -16px;padding:4px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);touch-action:pan-y}
.vit-fita{display:flex;align-items:baseline;gap:34px;width:max-content;transition:transform .7s var(--ease);will-change:transform}
.vit-t{flex:none;min-height:44px;border:0;background:none;padding:0;color:var(--mut);font-family:var(--fs);font-style:italic;font-size:clamp(1.7rem,6.4vw,3.4rem);line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.vit-t[aria-current="true"]{color:var(--ink);font-style:normal}
.vit-t .formato{font-size:13px}
.vit-rotulo{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut)}
.vit-rotulo span.lg{gap:2px}
.vit-rotulo button{display:grid;place-items:center;min-height:44px;min-width:44px;border:0;background:none;color:var(--ink2)}
/* ficha do item: conteúdo primeiro */
.f-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--mut)}
.f-kicker .tp{color:var(--ink)}
.d-title{min-height:44px;font-family:var(--fs);font-weight:400;font-size:clamp(2.1rem,7.4vw,3.2rem);line-height:1.02;letter-spacing:-.02em;font-variation-settings:normal}
.previa{position:relative;display:block;width:100%;margin-top:18px;border:0;border-radius:14px;overflow:hidden;background:var(--lomb);padding:0;box-shadow:var(--sombra2);color:#FBF5E8;text-decoration:none;cursor:pointer}
.previa.video{aspect-ratio:16/9;max-height:min(46vh,420px)}
.embed iframe[style*="aspect-ratio"]{max-height:min(60vh,520px)}
.previa img{display:block;width:100%;height:100%;object-fit:cover}
.previa .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(transparent 50%,rgba(0,0,0,.45))}
.previa .play i{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:rgba(251,245,232,.94);color:#1A140F;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s var(--mola)}
.previa:hover .play i{transform:scale(1.08)}
.previa .play i svg.i{width:30px;height:30px;--ic:#1A140F}
.previa .rodape{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;gap:8px;color:#FBF5E8;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px}
.previa.card{display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:170px;padding:18px 20px;text-align:left}
.previa.card .pl{font-family:var(--fs);font-size:clamp(2.2rem,9vw,3.4rem);line-height:.95}
.previa.card svg.i{width:34px;height:34px;--ic:#FBF5E8}
.previa.card .linha{display:flex;align-items:center;justify-content:space-between;gap:10px}
.embed{margin-top:18px;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--sombra2)}
.embed iframe{display:block;width:100%;border:0}
.consumir{display:flex;align-items:center;gap:14px;min-height:70px;margin-top:14px;padding:12px 16px 12px 20px;border-radius:16px;background:var(--acc);color:var(--acc-on);text-decoration:none;box-shadow:0 3px 0 color-mix(in srgb,var(--acc) 60%,#000),0 14px 30px -12px color-mix(in srgb,var(--acc) 70%,transparent);transition:transform .25s var(--mola)}
.consumir:hover{transform:translateY(-2px)}
.consumir:active{transform:translateY(2px)}
.consumir b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.consumir small{display:block;font-family:var(--fm);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.consumir span{flex:1;min-width:0}
.consumir svg.i{width:26px;height:26px;color:var(--acc-on);--ic:var(--acc-on)}
.consumir .seta{transition:transform .3s var(--mola)}
.consumir:hover .seta{transform:translateX(4px)}
.consumir.sm{min-height:52px;margin-top:0;padding:8px 14px;border-radius:999px}
.consumir.sm b{font-size:15px}
.f-ex{margin:18px 0 0;font-family:var(--fd);font-size:17px;line-height:1.6;color:var(--ink2);max-width:65ch}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.acoes .chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-on)}
.colar{margin-top:22px;border-top:1px dashed var(--line2);padding-top:6px}
.colar summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;color:var(--mut);font-size:14px;font-weight:600;list-style:none}
.colar summary::-webkit-details-marker{display:none}
.colar textarea{width:100%;min-height:140px;margin-top:6px}
.f-arq{margin-top:28px}
/* papel amassado que desdobra e mantém as dobras */
.dobras{position:relative}
.dobras::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:.5;background:
 linear-gradient(112deg,transparent 30%,rgba(255,255,255,.2) 30.3%,rgba(0,0,0,.16) 30.9%,transparent 31.6%),
 linear-gradient(26deg,transparent 57%,rgba(0,0,0,.14) 57.3%,rgba(255,255,255,.18) 57.9%,transparent 58.6%),
 linear-gradient(-50deg,transparent 43%,rgba(255,255,255,.16) 43.3%,rgba(0,0,0,.14) 43.9%,transparent 44.6%),
 linear-gradient(171deg,transparent 69%,rgba(0,0,0,.12) 69.3%,rgba(255,255,255,.14) 69.9%,transparent 70.6%),
 linear-gradient(74deg,transparent 18%,rgba(0,0,0,.1) 18.3%,rgba(255,255,255,.12) 18.9%,transparent 19.6%)}
@media (prefers-reduced-motion:no-preference){
  .desdobra{animation:desdobra .8s cubic-bezier(.2,.9,.25,1) both}
  .desdobra.dobras::after{animation:vincos 1s ease-out both}
}
@keyframes desdobra{0%{transform:scale(.5) rotate(-18deg);clip-path:polygon(30% 22%,46% 12%,61% 20%,78% 16%,84% 34%,76% 50%,86% 66%,70% 80%,54% 74%,38% 86%,22% 72%,16% 52%,24% 38%)}55%{transform:scale(1.02) rotate(1deg);clip-path:polygon(2% 3%,40% 0%,60% 2%,99% 0%,100% 30%,98% 50%,100% 70%,98% 100%,60% 98%,40% 100%,0% 99%,2% 60%,0% 40%)}100%{transform:none;clip-path:polygon(0% 0%,40% 0%,60% 0%,100% 0%,100% 30%,100% 50%,100% 70%,100% 100%,60% 100%,40% 100%,0% 100%,0% 60%,0% 40%)}}
@keyframes vincos{from{opacity:1}to{opacity:.5}}


/* ===== v3: abertura do fantasma (D4), página que sai do objeto (M4), doca da sala, pôster (D3) ===== */
.fantasma{width:min(46vw,210px);height:auto;overflow:visible}
.fa-lencol{fill:#F2EDE4;stroke:#0E0D0C;stroke-width:3}
.fa-oculos{fill:rgba(255,200,61,.18);stroke:#0E0D0C;stroke-width:4;stroke-linecap:round}
.fa-olhos{fill:#0E0D0C;transform-origin:60px 49px;animation:pisca 3.2s infinite}
.fa-boca{fill:#0E0D0C}
.fa-capa{fill:#22C7F0;stroke:#0E0D0C;stroke-width:3;stroke-linejoin:round}
.fa-pag{fill:#FFFDF7;stroke:#0E0D0C;stroke-width:1.6}
.fa-vira{fill:#FFF6E6;stroke:#0E0D0C;stroke-width:1.6;transform-origin:60px 95px;animation:vira 1.1s .55s cubic-bezier(.6,0,.3,1) both}
.fa-linhas{fill:none;stroke:#0E0D0C;stroke-width:1.4;opacity:.55}
.fa-maos{fill:#F2EDE4;stroke:#0E0D0C;stroke-width:3}
.fa-corpo{animation:flutua 2.6s ease-in-out infinite}
@keyframes pisca{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes vira{0%{transform:scaleX(1)}55%{transform:scaleX(-.1)}100%{transform:scaleX(-1)}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.abertura{position:fixed;inset:0;z-index:95;display:grid;place-items:center;align-content:center;gap:12px;background:#0E0D0C;transition:opacity .42s var(--ease),transform .42s var(--ease)}
.abertura.sai{opacity:0;transform:scale(1.06);pointer-events:none}
.abertura .ab-luz{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(34,199,240,.42),transparent 42%),radial-gradient(circle at 58% 40%,rgba(43,89,255,.28),transparent 46%);animation:fade .8s var(--ease) both}
.abertura .fantasma{position:relative;animation:surge .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes surge{0%{opacity:0;transform:scale(.4) rotate(-14deg);clip-path:polygon(30% 22%,46% 12%,61% 20%,78% 16%,84% 34%,76% 50%,86% 66%,70% 80%,54% 74%,38% 86%,22% 72%,16% 52%,24% 38%)}60%{opacity:1;transform:scale(1.04) rotate(2deg);clip-path:polygon(0% 0%,40% 0%,60% 0%,100% 0%,100% 30%,100% 50%,100% 70%,100% 100%,60% 100%,40% 100%,0% 100%,0% 60%,0% 40%)}100%{transform:none;clip-path:polygon(0% 0%,40% 0%,60% 0%,100% 0%,100% 30%,100% 50%,100% 70%,100% 100%,60% 100%,40% 100%,0% 100%,0% 60%,0% 40%)}}
.ab-nome{position:relative;display:flex;font-family:var(--fd);font-variation-settings:"wdth" 82;font-weight:800;font-size:clamp(3rem,14vw,5.4rem);letter-spacing:-.04em;color:#F2EDE4;line-height:1}
.ab-carga{position:relative;display:flex;align-items:center;gap:12px;margin-top:18px;color:#BFD9E2;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ab-carga i{display:block;width:min(46vw,220px);height:6px;border:1px solid rgba(191,217,226,.5);border-radius:3px;overflow:hidden}
.ab-carga b{display:block;height:100%;width:0;background:#22C7F0}
@keyframes carga{to{width:100%}}

/* pôster: a mesma sala em CSS */

.p-mon{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(92vw,460px);background:#0B0F10;border:1px solid #263238;border-radius:12px;padding:14px;color:#E6F0EA;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:16px 16px}

/* ===== v3: Bricolage Grotesque + Geist Mono (T1 a T3) ===== */
body{font-family:var(--f);font-variation-settings:"wdth" 100;font-weight:400}

.vt{font-size:clamp(2.6rem,10vw,3.8rem);line-height:.98}

.rtitle{font-size:calc(17px*var(--letra));line-height:1.22;letter-spacing:-.01em}

.kicker,.mono,.tab,.carimbo span,.sec-lbl h2,h3.dia,.grupo>span,.resumo .lbl,.capa .cm,.f-kicker,.vit-rotulo,.rodape,.consumir small{font-family:var(--fm)}

/* ===================== v4: espaço (design-rules T7 C5 C6 N1 N2 F1 K13 S1) ===================== */
:root{--fs:var(--f)}
h1,h2,h3,.vt,.marca,.next-title,.d-title,.capa .ct,.vit-t,.drawer-top b,.folha-top b,.rtitle,.resumo .tese,.previa.card .pl,.consumir b,.livro3d .esq h3,.porta-marca,.pag-valor,.ab-nome{font-family:var(--f);font-variation-settings:normal;font-style:normal;letter-spacing:-.02em}
body,.reading,.next-excerpt,.f-ex,.resumo ul,.tira input,.vazio-mesa,.empty,.now{font-variation-settings:normal}
.tab{font-family:var(--f);text-transform:none;letter-spacing:0}
/* papel fora das telas 2D (D1 revisada): sem grão, carimbo, envelope, fita, dobras */
.carimbos,.vitrine,.aberto,.envelope,.fita,.fitinha,.marcador,.amassa,.pagina{display:none!important}

.wrap{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 40px)}
/* topo fixo, mínimo: marca + busca + ajustes (N2) */
.topo{position:sticky;top:0;z-index:6;min-height:56px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--vidro);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.marca{font-size:22px;font-weight:800;gap:10px;color:var(--ink)}
.marca .selo{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg)}
.marca .selo svg{width:24px;height:24px}
.ic{color:var(--ink);border-radius:999px}
.ic:hover{background:var(--surf2)}
.banner{border-left-color:var(--acc);background:var(--surf2)}
/* títulos de tela */
.vt{font-size:clamp(1.9rem,7vw,2.5rem);font-weight:800;line-height:1.05;margin:18px 0 14px}
.vt sup{display:none}
h3.dia{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--mut);margin:24px 0 6px}
/* linhas no estilo do X: sem sombra, divisória fina, um dado por linha (F1) */
.list{gap:0;border-top:1px solid var(--line)}
.ficha{border-radius:0;box-shadow:none;background:transparent;border-bottom:1px solid var(--line);padding-left:0}
.ficha::before{display:none}
.ficha:hover{transform:none;background:color-mix(in srgb,var(--surf2) 70%,transparent);box-shadow:none}
.row{padding:14px 4px;gap:14px;align-items:center}
.tipo-ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--lomb) 55%,#000);color:#fff;--ic:#fff}
:root[data-cor="claro"] .tipo-ic{background:var(--lomb)}
.tipo-ic svg.i .d{fill-opacity:.35}
.rtitle{font-family:var(--f);font-weight:700;font-size:calc(16px*var(--letra));line-height:1.3;letter-spacing:-.01em}
.rmeta{font-size:14px;color:var(--mut);gap:2px 10px}

.ractions{padding:0 4px 14px 60px}
.empty{font-family:var(--f);font-size:16px}
/* botões */
.btn{border:1px solid var(--line2);background:transparent;box-shadow:none;color:var(--ink);font-weight:700;font-size:15px}
.btn:hover{background:var(--surf2);border-color:var(--line2);transform:none}

.tira{transform:none;border-radius:999px;background:var(--surf2);box-shadow:none;min-height:54px;padding:5px 5px 5px 18px;margin-bottom:6px}
.tira::before,.tira::after{display:none}

/* barra inferior no estilo do X: 5 lugares, sem números (N1) */
.nav{padding:0}
.nav-in{max-width:none;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--vidro);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:none;height:calc(var(--nav-h) + var(--safe-b));padding:0 max(4px,env(safe-area-inset-right,0px)) var(--safe-b) max(4px,env(safe-area-inset-left,0px));align-items:start}

button.consumir{border:0;width:100%;font:inherit;text-align:left;cursor:pointer}

.mais{width:48px;height:48px;margin-top:6px;border-radius:16px;background:var(--acc);color:var(--acc-on);box-shadow:0 8px 24px -8px color-mix(in srgb,var(--acc) 80%,transparent)}

/* guardar: terminal (K1 revisada, o estilo que vira a identidade) */
.drawer{background:color-mix(in srgb,#000 55%,transparent);align-items:center}

/* ficha do item */
.sheet{background:var(--bg)}
.sheet-top{background:var(--vidro);border-bottom:1px solid var(--line)}

.d-title{font-weight:800;font-size:clamp(1.7rem,6.4vw,2.4rem);line-height:1.1}

<script>
/*CORE-START*/
const TYPES=[
  {k:'artigo',label:'artigo',icon:'article'},
  {k:'grok',label:'x / grok',icon:'at'},
  {k:'youtube',label:'youtube',icon:'video'},
  {k:'instagram',label:'instagram',icon:'insta'},
  {k:'busca',label:'busca',icon:'search'},
  {k:'ia',label:'documento de ia',icon:'spark'},
  {k:'conversa',label:'conversa',icon:'chat'},
  {k:'musica',label:'música',icon:'note'},
  {k:'video',label:'vídeo',icon:'film'},
  {k:'outro',label:'outro',icon:'bookmark'},
  {k:'pagamento',label:'pagamento',icon:'pix'}
];
const TYPE=Object.fromEntries(TYPES.map(t=>[t.k,t]));
/* Revisão espaçada: datas fixas a partir do dia em que salvou (D+1, D+7, D+30). */
const OFFSETS=[1,7,30];

const pad=n=>String(n).padStart(2,'0');
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const p=String(k||'').split('-').map(Number);return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1);}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dayKey(d);}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5);}
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDay(k,today){today=today||dayKey();const n=diffDays(today,k);
  if(n===0)return 'hoje';if(n===-1)return 'ontem';if(n===1)return 'amanhã';
  const d=parseKey(k);return WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()];}
function reviewAfter(item,today){
  let s=(item.step||0)+1;
  while(s<OFFSETS.length&&addDays(item.day,OFFSETS[s])<=today)s++;
  if(s>=OFFSETS.length)return {step:OFFSETS.length,due:null};
  return {step:s,due:addDays(item.day,OFFSETS[s])};
}

const URL_RE=/https?:\/\/[^\s<>"'`]+/i;
function trimUrl(u){
  let s=String(u||'').replace(/[.,;:!?]+$/,'');
  while(s.endsWith(')')&&(s.match(/\)/g)||[]).length>(s.match(/\(/g)||[]).length)s=s.slice(0,-1);
  while(s.endsWith(']')&&(s.match(/\]/g)||[]).length>(s.match(/\[/g)||[]).length)s=s.slice(0,-1);
  return s;
}
function safeHttpUrl(u){
  if(!u||typeof u!=='string')return null;
  const clean=trimUrl(u.trim());
  try{const p=new URL(clean);return (p.protocol==='http:'||p.protocol==='https:')?p.href:null;}catch(e){return null;}
}
function normUrl(s){s=String(s||'').trim();
  if(/^https?:\/\/\S+$/i.test(s))return safeHttpUrl(s);
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(s))return safeHttpUrl('https://'+s);
  return null;}
function hostOf(u){try{return new URL(u).hostname.toLowerCase().replace(/^(www|m|mobile)\./,'');}catch(e){return '';}}
const AI_HOSTS={'chatgpt.com':'ChatGPT','chat.openai.com':'ChatGPT','claude.ai':'Claude','gemini.google.com':'Gemini','copilot.microsoft.com':'Copilot','chat.deepseek.com':'DeepSeek','poe.com':'Poe','meta.ai':'Meta AI','chat.mistral.ai':'Mistral','notebooklm.google.com':'NotebookLM','notebook.google':'Gemini Notebook','aistudio.google.com':'AI Studio','perplexity.ai':'Perplexity'};
function typeFromUrl(u){
  let url;try{url=new URL(u);}catch(e){return 'outro';}
  const h=hostOf(u),p=url.pathname.toLowerCase();
  const is=(...ds)=>ds.some(d=>h===d||h.endsWith('.'+d));
  if(/^google\.[a-z.]+$/.test(h)&&p.startsWith('/url')){const q=url.searchParams.get('q')||url.searchParams.get('url');const sq=safeHttpUrl(q);if(sq)return typeFromUrl(sq);}
  if(is('grok.com','x.com','twitter.com','t.co','x.ai'))return 'grok';
  if(is('youtube.com','youtu.be'))return 'youtube';
  if(is('instagram.com','instagr.am'))return 'instagram';
  if(is('perplexity.ai','share.google','g.co'))return 'busca';
  if(is(...Object.keys(AI_HOSTS)))return /\/(artifact|artifacts|canvas|public|publish|pub)(\/|$)/.test(p)?'ia':'conversa';
  if(/^google\.[a-z.]+$/.test(h))return p.startsWith('/search')?'busca':'outro';
  if(/(^|\.)google\.[a-z.]+$/.test(h))return 'outro';
  if(is('tiktok.com','vimeo.com','kwai.com','fb.watch'))return 'video';
  if(is('facebook.com')&&/\/(reel|watch|videos)/.test(p))return 'video';
  if(is('spotify.com','music.apple.com','deezer.com','soundcloud.com'))return 'musica';
  if(is('facebook.com','threads.net','whatsapp.com','wa.me'))return 'outro';
  return 'artigo';
}
function titleFromUrl(u){
  let url;try{url=new URL(u);}catch(e){return u;}
  const h=hostOf(u);const segs=url.pathname.split('/').filter(Boolean);
  if(/^google\./.test(h)){const q=url.searchParams.get('q');if(q)return 'Busca: '+q;}
  if((h==='x.com'||h==='twitter.com')&&segs[0]&&!['i','search','home'].includes(segs[0]))return 'Post de @'+segs[0];
  if(h==='grok.com')return 'Conversa no Grok';
  if(h==='instagram.com')return /^(reel|reels|tv)$/.test(segs[0]||'')?'Reels do Instagram':(segs[0]&&segs[0]!=='p'?'Post de @'+segs[0]:'Post do Instagram');
  if(h==='open.spotify.com'||h==='spotify.com')return segs.includes('episode')||segs.includes('show')?'Podcast no Spotify':'Música no Spotify';
  if(h==='tiktok.com')return segs[0]&&segs[0].startsWith('@')?'Vídeo de '+segs[0]:'Vídeo do TikTok';
  if(h==='youtube.com'||h==='youtu.be')return segs[0]==='shorts'?'Shorts do YouTube':'Vídeo do YouTube';
  for(const k in AI_HOSTS){if(h===k||h.endsWith('.'+k)){
    if(k==='perplexity.ai'&&segs[0]==='search'&&segs[1]){const w=segs[1].split('-').filter(x=>!/^[A-Za-z0-9]{10,}$/.test(x));if(w.length>=2){const t=w.join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}}
    return (typeFromUrl(u)==='ia'?'Documento no ':'Conversa no ')+AI_HOSTS[k];}}
  for(let i=segs.length-1;i>=0;i--){
    let s;try{s=decodeURIComponent(segs[i]);}catch(e){s=segs[i];}
    s=s.replace(/\.(html?|php|aspx?)$/i,'');
    const words=s.split(/[-_+]+/).filter(Boolean);
    if(words.length>=3&&/[a-zà-ú]{3}/i.test(s)&&!/^[0-9a-f-]{16,}$/i.test(s)){
      const t=words.join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}
  }
  return h+(segs.length?' / '+segs.slice(0,2).join('/'):'');
}
function titleFromText(t){
  const lines=t.split('\n').map(s=>s.replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/,'').replace(/[*_`]/g,'').trim()).filter(s=>s.length>2&&!/^(vis[aã]o geral (criada|gerada) por ia|ai overview)$/i.test(s)&&!/^https?:\/\/\S+$/i.test(s));
  const line=lines[0]||'Sem título';
  if(line.length<=90)return line;
  const cut=line.slice(0,90);const sp=cut.lastIndexOf(' ');
  return (sp>40?cut.slice(0,sp):cut)+'…';
}
function classifyText(t){
  const lower=t.toLowerCase();
  if(/vis[aã]o geral (criada|gerada) por ia|ai overview|\bmodo ia\b|\bai mode\b/.test(lower))return 'busca';
  const turns=(t.match(/^\s*(voc[eê]|user|usu[aá]rio|eu|chatgpt|claude|grok|gemini|assistant|assistente|ia)\s*(disse|said)?\s*:/gim)||[]).length;
  if(turns>=2||/\b(you said|voc[eê] disse)\b/i.test(t))return 'conversa';
  const md=(t.match(/^#{1,4}\s/gm)||[]).length+((t.match(/^\s*([-*•]|\d+\.)\s/gm)||[]).length>=3?2:0)+(/\*\*[^*\n]+\*\*/.test(t)?1:0);
  if(t.length>500&&md>=2)return 'ia';
  return null;
}
function detect(raw){
  const t=(raw||'').trim();if(!t)return null;
  const pg=detectPagamento(t);
  if(pg)return {type:'pagamento',url:null,body:'',title:pg.tipo==='pix'?'Pix'+(pg.quem?' · '+pg.quem:''):pg.tipo==='boleto'?'Boleto'+(pg.valor?' · '+brl(pg.valor):''):titleFromText(t),pag:pg,linkShare:false,keepTitle:true};
  const single=/\s/.test(t)?null:normUrl(t);
  if(single)return {type:typeFromUrl(single),url:single,body:'',title:titleFromUrl(single),linkShare:true};
  const m=t.match(URL_RE);const url=m?safeHttpUrl(m[0]):null;
  if(url){
    const rest=t.replace(m[0],'').replace(/^[\s:.,|-]+|[\s:.,|-]+$/g,'').trim();
    /* Compartilhamento do iOS/Android ("Título curto https://...") vira link limpo com título real */
    if(!rest)return {type:typeFromUrl(url),url,body:'',title:titleFromUrl(url),linkShare:true};
    if(rest.length<=120&&!rest.includes('\n'))return {type:typeFromUrl(url),url,body:'',title:rest,linkShare:true,keepTitle:true};
  }
  let type=classifyText(t);
  if(!type&&url)type=typeFromUrl(url);
  if(!type)type=t.length>1500?'artigo':'outro';
  return {type,url,body:t,title:titleFromText(t),linkShare:false};
}
function stripMd(t){return t.replace(/```[\s\S]*?```/g,' ').replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/gm,'').replace(/[*_`|]/g,'');}
function excerptOf(t){const s=stripMd(t||'').replace(/\s+/g,' ').trim();return s.length>240?s.slice(0,240).replace(/\s\S*$/,'')+'…':s;}
function wordCount(t){const m=(t||'').trim().match(/\S+/g);return m?m.length:0;}
function speechText(t){return t.replace(/```[\s\S]*?```/g,'\n(bloco de código)\n').replace(/https?:\/\/\S+/g,'link').replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/gm,'').replace(/[*_`#|>]/g,'').replace(/^\s*-{3,}\s*$/gm,'');}
function chunkify(text,max){
  const out=[];let pos=0;
  for(const raw of text.split('\n')){
    const para=raw.trim();const at=text.indexOf(raw,pos);pos=at+raw.length;
    if(!para)continue;
    const base=at+raw.indexOf(para);
    if(para.length<=max){out.push({text:para,start:base});continue;}
    const sents=para.split(/(?<=[.!?…;:])\s+/);
    let cur='',curStart=base,off=0;
    const push=()=>{if(cur.trim())out.push({text:cur.trim(),start:curStart});cur='';};
    for(const s of sents){
      const sAt=para.indexOf(s,off);off=sAt+s.length;
      if(s.length>max){push();let rest=s,rAt=sAt;
        while(rest.length>max){let cut=rest.lastIndexOf(' ',max);if(cut<max/2)cut=max;out.push({text:rest.slice(0,cut).trim(),start:base+rAt});rest=rest.slice(cut);rAt+=cut;}
        cur=rest;curStart=base+rAt;continue;}
      if(!cur){cur=s;curStart=base+sAt;}
      else if(cur.length+1+s.length<=max)cur+=' '+s;
      else{push();cur=s;curStart=base+sAt;}
    }
    push();
  }
  return out;
}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function summaryPrompt(it,body,lang){
  const L=lang==='en'?'inglês':'português do Brasil';
  return 'Leia o conteúdo abaixo e responda em '+L+', em tom de conversa, como um amigo que explica rápido.\n'+
    'Responda só com JSON neste formato: {"titulo": "até 8 palavras dizendo do que se trata, sem nome de site ou plataforma", "tese": "uma frase de até 25 palavras com a ideia central", "pontos": ["até 3 pontos, cada um com até 18 palavras"]}\n'+
    'Regras: use só o que está no texto, sem inventar; frases curtas e diretas; sem emoji; sem travessão longo; se for uma conversa, diga o que foi concluído.\n\n'+
    'Tipo: '+((TYPE[it.type]||TYPE.outro).label)+'\n\nTexto:\n'+body.slice(0,24000);
}
function cleanSummary(s){

/* Feedback tátil real no Android (navigator.vibrate) + pulso acústico curto opcional no iPhone */
let audioCtx=null;
function tapFeedback(kind){
  try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function'&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(kind==='ok'?[10,22,12]:8);}catch(e){}
  if(!prefs.som||calm())return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(kind==='ok'?210:155,now);
    osc.frequency.exponentialRampToValueAtTime(kind==='ok'?120:85,now+0.022);
    g.gain.setValueAtTime(0.028,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.024);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start(now);osc.stop(now+0.025);
  }catch(e){}
}

function makeMemoryDb(){
  const cols={},subs={};
  const col=n=>cols[n]||(cols[n]=new Map());
  try{const raw=localStorage.getItem('bp:localdb');if(raw){const o=JSON.parse(raw);for(const n in o)cols[n]=new Map(Object.entries(o[n]));}}catch(e){}
  const persist=()=>{
    try{const o={};for(const n in cols)o[n]=Object.fromEntries(cols[n]);localStorage.setItem('bp:localdb',JSON.stringify(o));localStorage.setItem('bp:localdb:v','1');}
    catch(e){throw {code:'quota_exceeded',message:'localStorage cheio'};}
  };
  const emit=n=>{persist();(subs[n]||[]).forEach(f=>f());};
  const snap=(id,data)=>({id,exists:!!data,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
  const clone=d=>JSON.parse(JSON.stringify(d));
  /* v4: ganchos para a conta (S1) mandar cada mudança à nuvem */
  const ganchos=[];const avisa=(n,id)=>{const d=col(n).get(id);ganchos.forEach(f=>{try{f(n,id,d?clone(d):null);}catch(e){}});};
  const docRef=(n,id)=>({id,
    get:async()=>snap(id,col(n).get(id)),
    set:async d=>{col(n).set(id,clone(d));emit(n);avisa(n,id);},
    update:async d=>{const c=col(n).get(id);if(!c)throw {code:'invalid_argument',message:'missing'};col(n).set(id,Object.assign({},c,clone(d)));emit(n);avisa(n,id);},
    delete:async()=>{col(n).delete(id);emit(n);avisa(n,id);}});
  const q=n=>{const o={orderBy:()=>o,limit:()=>o,where:()=>o,
    onSnapshot(next){const f=()=>{const docs=[...col(n)].map(([id,d])=>snap(id,d));next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]});};
      (subs[n]=subs[n]||[]).push(f);setTimeout(f,0);return ()=>{subs[n]=subs[n].filter(x=>x!==f);};},
    doc:id=>docRef(n,id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8)))};return o;};
  return {collection:q,doc:p=>{const s=p.split('/');return docRef(s[0],s[1]);},
    on:f=>ganchos.push(f),
    tudo:()=>{const o={};for(const n in cols)o[n]=Object.fromEntries([...cols[n]].map(([k,v])=>[k,clone(v)]));return o;},
    importar:(n,id,d)=>{if(d)col(n).set(id,clone(d));else col(n).delete(id);},
    avisar:n=>emit(n)};
}

function errMsg(e){const c=e&&e.code;
  if(c==='quota_exceeded')return 'armazenamento cheio. arquive itens antigos.';
  if(c==='invalid_argument')return 'não salvou. texto grande demais.';
  if(c==='unavailable'||c==='resource_exhausted')return 'sem conexão. tente de novo.';
  if(c==='revoked'||c==='not_granted')return 'recarregue a página.';
  return 'não salvou. tente de novo.';}

const queues={};
function patch(id,data,colName){
  colName=colName||'items';const key=colName+'/'+id;
  const q=queues[key]||(queues[key]={pending:null,running:false});
  q.pending=Object.assign(q.pending||{},data,{updatedAt:Date.now()});
  const local=(colName==='items'?items:colName==='shelves'?shelves:wants).get(id);if(local)Object.assign(local,data);
  if(q.running)return q.promise;
  q.running=true;
  q.promise=(async()=>{
    try{while(q.pending){const d=q.pending;q.pending=null;await withRetry(()=>db.collection(colName).doc(id).update(d));}}
    catch(e){toast(errMsg(e));throw e;}
    finally{q.running=false;}
  })();
  return q.promise.catch(()=>{});
}
async function withRetry(fn){try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));return fn();}throw e;}}

async function writeBody(id,text){
  const parts=Math.ceil(text.length/PART);
  for(let i=0;i<parts;i++)await withRetry(()=>db.collection('bodies').doc(id+'_'+i).set({text:text.slice(i*PART,(i+1)*PART)}));
  bodies.set(id,text);
  return parts;
}
async function loadBody(it){
  if(bodies.has(it.id))return bodies.get(it.id);
  if(!it.parts)return '';
  const snaps=await Promise.all(Array.from({length:it.parts},(_,i)=>db.collection('bodies').doc(it.id+'_'+i).get()));
  const t=snaps.map(s=>s.exists?(s.data().text||''):'').join('');
  bodies.set(it.id,t);return t;
}

/* Guarda qualquer texto ou link e devolve {id,title,type}. Usado pela gaveta, pela tira da mesa e pela sala 3D. */
async function saveText(raw,o){
  o=o||{};const d=detect(raw);if(!d||!db)return null;
  const safeUrl=safeHttpUrl(d.url);
  const type=o.type||d.type;const now=Date.now();const day=dayKey();
  const ref=db.collection('items').doc();
  const parts=d.body?await writeBody(ref.id,d.body):0;
  const extra=d.pag?{pag:Object.assign({pago:false},d.pag),due:d.pag.venc||addDays(day,1),manual:true}:{due:addDays(day,OFFSETS[0])};
  await withRetry(()=>ref.set(Object.assign({title:d.title,type,url:safeUrl||null,excerpt:excerptOf(d.body),words:wordCount(d.body),parts,note:'',createdAt:now,updatedAt:now,day,step:0,archived:false,done:false,titleAuto:!d.keepTitle,shelves:o.shelf?[o.shelf]:[]},extra)));
  tapFeedback('ok');
  if(safeUrl&&!d.body&&!d.keepTitle)fetchTitle(ref.id,safeUrl);
  if(!o.quiet)envelope(d.title,type);
  return {id:ref.id,title:d.title,type,body:!!d.body};
}
