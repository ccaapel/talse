<title>Stuff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..700&display=swap">
<style>
/* Biblioteca do Pedro (Stuff): uma família (Plus Jakarta Sans), uma cor de destaque verde (#1D7A55 / #4CC38A),
   três temas (claro, penumbra, escuro), coluna de leitura de 65ch, barra inferior enxuta para iPhone. */
:root{
  --bg:#F5F2EA; --surf:#FCFBF7; --ink:#18201B; --ink2:#2E3932; --mut:#566159; --line:#E3DFD3; --line2:#CBC6B8;
  --acc:#1D7A55; --acc-txt:#1D7A55; --acc-soft:color-mix(in srgb,var(--acc) 11%,transparent);
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --raio:4px; --raio-bt:2px; --ease:cubic-bezier(.2,.7,.2,1);
  --nav-h:48px;
  --safe-b:max(4px,calc(env(safe-area-inset-bottom,0px) - 8px));
  color-scheme:light;
}
@media (display-mode:standalone){
  :root{--safe-b:max(6px,calc(env(safe-area-inset-bottom,0px) - 6px))}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-cor]){
  --bg:#101412; --surf:#171C19; --ink:#ECE8DB; --ink2:#CFCBBD; --mut:#939E96; --line:#232A26; --line2:#353D38;
  --acc:#4CC38A; --acc-txt:#4CC38A; color-scheme:dark}}
:root[data-theme="dark"]:not([data-cor]),:root[data-cor="escuro"]{
  --bg:#101412; --surf:#171C19; --ink:#ECE8DB; --ink2:#CFCBBD; --mut:#939E96; --line:#232A26; --line2:#353D38;
  --acc:#4CC38A; --acc-txt:#4CC38A; color-scheme:dark}
:root[data-cor="penumbra"]{
  --bg:#19221E; --surf:#202B26; --ink:#ECE8DB; --ink2:#D0CCC0; --mut:#98A59D; --line:#2B3832; --line2:#3D4C45;
  --acc:#58CB95; --acc-txt:#58CB95; color-scheme:dark}
:root[data-cor="claro"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;overflow-x:clip;max-width:100%}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--acc-txt)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + var(--safe-b) + 28px)}
body.has-mini .wrap{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 84px)}

.topo{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--line);gap:8px}
.marca{font-size:15px;font-weight:650;letter-spacing:-.02em;text-transform:lowercase;color:var(--ink);background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center;gap:7px}
.marca svg.i{width:17px;height:17px;color:var(--acc-txt)}
.topo-r{display:flex;align-items:center;gap:2px}
.ic{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--raio);background:none;color:var(--ink2);flex:none;text-decoration:none}
.ic:hover{color:var(--ink)}
.ic:active{transform:scale(.96)}
.ic:disabled{opacity:.35;cursor:default}
.ic[aria-pressed="true"]{color:var(--acc-txt)}
.banner{border-left:2px solid var(--acc);padding:8px 12px;margin:10px 0;font-size:14px;color:var(--ink2);background:var(--surf)}

/* Formato B na abertura: cabeçalho compacto + lembrar hoje + próximo item + captura em 1 toque */
.home-head{display:grid;gap:14px;padding-top:16px}
.home-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rev-pill{position:relative;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surf);font-size:13.5px;font-weight:600;color:var(--ink);text-transform:lowercase}
.rev-pill.due{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-txt)}
.rev-pill b{font-weight:700}
.pulse{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.pulse button{display:inline-flex;align-items:center;gap:5px;min-height:44px;border:0;background:none;padding:0 2px;color:var(--mut);font-size:13.5px;font-weight:500;text-transform:lowercase}
.pulse button:hover{color:var(--ink)}
.pulse b{color:var(--ink);font-weight:650}
.pulse svg.i{width:15px;height:15px}

.next-card{background:var(--surf);border:1px solid var(--line);border-radius:var(--raio);padding:16px;display:grid;gap:10px}
.next-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--acc-txt);text-transform:lowercase}
.next-kicker span.m{color:var(--mut);font-weight:500}
.next-open{background:none;border:0;padding:0;text-align:left;display:grid;gap:4px;min-width:0}
.next-title{font-size:clamp(1.2rem,3.8vw,1.5rem);line-height:1.24;font-weight:650;letter-spacing:-.02em;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.next-excerpt{font-size:14px;line-height:1.5;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin:0}
.next-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}

.quick-cap{display:flex;align-items:center;gap:8px}
.quick-btn{flex:1;min-width:0;min-height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--raio);background:var(--surf);color:var(--mut);font-size:14.5px;text-align:left;text-transform:lowercase}
.quick-btn:hover{border-color:var(--ink);color:var(--ink)}
.quick-btn svg.i{color:var(--acc-txt)}

.home-rec{margin-top:20px}
.sec-lbl{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mut);text-transform:lowercase;padding-bottom:6px;border-bottom:1px solid var(--line)}

/* Título compacto de cada seção */
.vt{font-size:clamp(1.45rem,3.2vw,1.85rem);line-height:1.15;letter-spacing:-.02em;text-transform:lowercase;margin:16px 0 10px}
.vt sup{font-size:13px;font-weight:650;color:var(--acc-txt);margin-left:5px;vertical-align:super;letter-spacing:0}
h3.dia{font-size:13px;font-weight:600;color:var(--mut);margin:18px 0 0;text-transform:lowercase}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border-radius:var(--raio-bt);border:1px solid var(--line2);background:transparent;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);text-transform:lowercase}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#FCFBF7;font-weight:600}
:root[data-cor="escuro"] .btn.acc,:root[data-cor="penumbra"] .btn.acc{color:#101412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-cor]) .btn.acc{color:#101412}}
.btn:disabled{opacity:.42;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}

.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list>li:last-child{border-bottom:0}
.row{display:flex;align-items:flex-start;gap:11px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:13px 0}
.row>svg.i{margin-top:3px;color:var(--mut)}
.rmain{display:grid;gap:3px;min-width:0;flex:1}
.rtitle{font-weight:600;font-size:15.5px;line-height:1.38;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.tag{font-weight:600;color:var(--acc-txt)}
.ractions{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding:0 0 13px 29px}
.empty{color:var(--mut);padding:24px 0;margin:0;font-size:14px;text-transform:lowercase}
.plats{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;width:100%;padding:0 0 13px}
.plats::-webkit-scrollbar{display:none}

.abas{display:flex;gap:4px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;border-bottom:1px solid var(--line)}
.abas::-webkit-scrollbar{display:none}
.aba{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;border:0;background:none;color:var(--mut);padding:0 10px;font-size:14px;font-weight:500;border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap;text-transform:lowercase}
.aba svg.i{width:16px;height:16px}
.aba[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.busca{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:0 6px 0 14px;background:var(--surf)}
.busca svg.i{color:var(--mut)}
.busca input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;outline:none}
.busca input::placeholder{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap;text-decoration:none;text-transform:lowercase}
.chip svg.i{width:15px;height:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rolo{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding:2px}
.rolo::-webkit-scrollbar{display:none}

/* Barra inferior compacta para iPhone (retrato, paisagem e PWA instalado) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);min-height:44px;background:none;border:0;color:var(--mut);font-size:12px;font-weight:500;min-width:0;text-transform:lowercase;padding:0 2px}
.tab svg.i{width:19px;height:19px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] svg.i{stroke-width:2;color:var(--acc-txt)}
.tab .n{position:absolute;top:4px;left:calc(50% + 8px);font-size:12px;font-weight:700;color:var(--acc-txt)}
.mais{justify-self:center;position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg)}
.mais::after{content:"";position:absolute;inset:-5px}
.mais svg.i{width:20px;height:20px;stroke-width:2.1}
.mais:active{transform:scale(.93)}

.mini{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:19;background:var(--surf);border-top:1px solid var(--line);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.mini-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:2px;height:52px}
.mini-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0 6px;display:grid}
.mini-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
.mini-title small{color:var(--mut);font-size:12px;text-transform:lowercase}

/* Gaveta de guardar adaptada ao teclado virtual do iPhone (100dvh) */
.drawer{position:fixed;inset:0;height:100dvh;z-index:35;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow-y:auto;overscroll-behavior:contain}
.drawer-in{max-width:680px;max-height:calc(100dvh - 8px);margin:0 auto;background:var(--bg);border-bottom:1px solid var(--line2);padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
.drawer-top{display:flex;align-items:center;justify-content:space-between}
.drawer-top b{font-size:18px;font-weight:650;letter-spacing:-.02em;text-transform:lowercase}
.drawer textarea{width:100%;min-height:88px;max-height:34dvh;resize:none;font-size:16px;line-height:1.45;border:1px solid var(--line2);border-radius:var(--raio);padding:11px 12px;background:var(--surf)}
.drawer textarea:focus{outline:none;border-color:var(--ink)}
.drawer textarea::placeholder{color:var(--mut)}
.drawer-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* Leitor */
.sheet{position:fixed;inset:0;height:100dvh;z-index:30;background:var(--bg);overflow-y:auto;overflow-x:clip;overscroll-behavior:contain}
.sheet-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sin{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-top .sin{display:flex;align-items:center;gap:4px}
.sheet-top .abas{border-bottom:0;flex:1;justify-content:flex-end}
.sheet-body{padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--mut);font-size:13px}
.meta select{min-height:44px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:transparent;padding:0 4px 0 0;font-size:16px;font-weight:500;color:var(--ink2);max-width:100%}
.meta a{display:inline-flex;align-items:center;gap:5px;font-weight:600;text-decoration:none;position:relative;text-transform:lowercase}
.meta a svg.i{width:15px;height:15px}
.d-title{display:block;width:100%;margin:10px 0 0;border:0;border-bottom:1px solid transparent;background:none;resize:none;overflow:hidden;font-size:clamp(1.45rem,5vw,1.95rem);line-height:1.22;font-weight:650;letter-spacing:-.02em;padding:0 0 4px;overflow-wrap:anywhere}
.d-title:focus{outline:none;border-bottom-color:var(--line2)}
.resumo{margin:18px 0 0;padding:14px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:65ch}
.resumo .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;color:var(--mut);margin-bottom:6px;text-transform:lowercase}
.resumo .tese{margin:0 0 8px;font-size:17px;line-height:1.55;font-weight:600}
.resumo ul{margin:0;padding-left:1.1em;color:var(--ink2);font-size:15.5px;line-height:1.6}
.resumo li+li{margin-top:3px}
.resumo .mut{font-size:14px;margin:0;color:var(--mut)}
.linkbtn{background:none;border:0;padding:0;color:var(--acc-txt);font-size:13px;font-weight:500;position:relative;text-transform:lowercase}
.linkbtn[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.linkbtn::after,.meta a::after,.toast button::after{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:44px;transform:translateY(-50%)}
.reading{margin-top:20px;font-size:18px;line-height:1.7;max-width:65ch;overflow-wrap:anywhere}
.reading p{margin:0 0 1.05em;text-wrap:pretty}
.reading h3{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.35;margin:1.5em 0 .5em}
.reading ul,.reading ol{margin:0 0 1.05em;padding-left:1.2em}
.reading li+li{margin-top:.25em}
.reading code{font-size:.86em;background:var(--surf);border:1px solid var(--line);border-radius:var(--raio-bt);padding:0 4px}
.revisao{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;font-weight:500;text-transform:lowercase}
.field{display:grid;gap:6px;font-size:13px;color:var(--mut);font-weight:500}
.field>span{display:flex;justify-content:space-between;gap:8px;text-transform:lowercase}
.field output{color:var(--ink);font-weight:600}
.field select,.field textarea{width:100%;max-width:100%;border:1px solid var(--line2);border-radius:var(--raio);background:var(--surf);color:var(--ink);font-size:16px}
.field select{min-height:44px;padding:0 8px}
.field textarea{min-height:220px;padding:12px;line-height:1.6;resize:vertical}
input[type=range]{width:100%;accent-color:var(--acc);min-height:28px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:44px;text-transform:lowercase}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.player{display:grid;gap:16px;margin-top:20px}
.now{font-size:18px;line-height:1.7;min-height:3.4em;max-width:65ch;overflow-wrap:anywhere}
.track{height:2px;background:var(--line2)}
.track i{display:block;height:2px;width:0;background:var(--acc)}
.pinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);text-transform:lowercase}
.pctl{display:flex;align-items:center;justify-content:center;gap:10px}
.playbig{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--bg)}
.playbig svg.i{width:25px;height:25px;stroke-width:2}
.playbig:active{transform:scale(.94)}
.pane-pad{margin-top:20px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.state{color:var(--mut);font-size:13px;margin:8px 0 0;min-height:1.2em;text-transform:lowercase}
.lg{display:inline-flex;gap:14px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:45;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--raio);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:inherit;font-weight:650;text-decoration:underline;padding:4px 0;flex:none;position:relative;text-transform:lowercase}
body.has-mini .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 66px)}

/* Abertura rápida com livro aberto (Lei 22 e Lei 29: sem sacola) */
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .22s var(--ease),transform .24s var(--ease)}
.splash.out{opacity:0;transform:translateY(-8px);pointer-events:none}
.booksvg{width:76px;height:76px;fill:none;stroke-linecap:round;stroke-linejoin:round}
.booksvg .ln{stroke:var(--acc);stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s var(--ease) forwards}
.booksvg .l2{animation-delay:.12s}
.booksvg .l3{animation-delay:.22s;stroke:var(--ink)}
.sw{font-size:24px;font-weight:650;letter-spacing:-.03em;text-transform:lowercase;color:var(--ink);opacity:0;animation:fade .3s var(--ease) .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:no-preference){
  .sheet:not([hidden]){animation:rise .22s var(--ease)}
  .drawer:not([hidden]) .drawer-in{animation:drop .2s var(--ease)}
  .toast{animation:fade .16s var(--ease)}
  .track i{transition:width .24s var(--ease)}
}

.shelf{display:none}
/* Paisagem no celular: reduz barra fixa, oculta excessos e preserva leitura */
@media (orientation:landscape) and (max-height:500px){
  :root{--nav-h:40px;--safe-b:max(2px,calc(env(safe-area-inset-bottom,0px) - 10px))}
  .topo{min-height:40px}

  .next-card{padding:12px}

/* Computador: estante por tipo com contagem e layout centrado (Lei 26) */
@media (min-width:900px){
  .wrap{max-width:1080px}
  section:not([data-view="inicio"])>*{max-width:740px;margin-left:auto;margin-right:auto}
  .topo{max-width:1080px}
  .home-head,.home-rec{max-width:740px;margin-left:auto;margin-right:auto}
  .nav-in,.mini-in{max-width:740px}
  .shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:28px;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surf)}
  .sh{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px 8px;min-width:0}
  .sh h3{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650;letter-spacing:0;margin:0 0 2px;text-transform:lowercase}
  .sh h3 svg.i{width:15px;height:15px;color:var(--mut)}
  .sh h3 span{margin-left:auto;font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line2);border-radius:var(--raio-bt);padding:0 6px}
  .sh .row{padding:9px 0}
  .sh .row>svg.i{display:none}
  .sh .rtitle{font-size:14px;font-weight:500;-webkit-line-clamp:1}
  .sh .rmeta{font-size:12px}
}

<script>
/*CORE-START*/
const TYPES=[
  {k:'artigo',label:'artigo',icon:'article'},
  {k:'grok',label:'x / grok',icon:'at'},
  {k:'youtube',label:'youtube',icon:'video'},
  {k:'instagram',label:'instagram',icon:'insta'},
  {k:'busca',label:'busca',icon:'search'},
  {k:'ia',label:'documento de ia',icon:'spark'},
  {k:'conversa',label:'conversa',icon:'chat'},
  {k:'musica',label:'música',icon:'note'},
  {k:'video',label:'vídeo',icon:'film'},
  {k:'outro',label:'outro',icon:'bookmark'}
];
const TYPE=Object.fromEntries(TYPES.map(t=>[t.k,t]));
/* Revisão espaçada: datas fixas a partir do dia em que salvou (D+1, D+7, D+30). */
const OFFSETS=[1,7,30];

const pad=n=>String(n).padStart(2,'0');
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const p=String(k||'').split('-').map(Number);return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1);}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return dayKey(d);}
function diffDays(a,b){return Math.round((parseKey(b)-parseKey(a))/864e5);}
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtDay(k,today){today=today||dayKey();const n=diffDays(today,k);
  if(n===0)return 'hoje';if(n===-1)return 'ontem';if(n===1)return 'amanhã';
  const d=parseKey(k);return WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()];}
function reviewAfter(item,today){
  let s=(item.step||0)+1;
  while(s<OFFSETS.length&&addDays(item.day,OFFSETS[s])<=today)s++;
  if(s>=OFFSETS.length)return {step:OFFSETS.length,due:null};
  return {step:s,due:addDays(item.day,OFFSETS[s])};
}

const URL_RE=/https?:\/\/[^\s<>"'`]+/i;
function trimUrl(u){
  let s=String(u||'').replace(/[.,;:!?]+$/,'');
  while(s.endsWith(')')&&(s.match(/\)/g)||[]).length>(s.match(/\(/g)||[]).length)s=s.slice(0,-1);
  while(s.endsWith(']')&&(s.match(/\]/g)||[]).length>(s.match(/\[/g)||[]).length)s=s.slice(0,-1);
  return s;
}
function safeHttpUrl(u){
  if(!u||typeof u!=='string')return null;
  const clean=trimUrl(u.trim());
  try{const p=new URL(clean);return (p.protocol==='http:'||p.protocol==='https:')?p.href:null;}catch(e){return null;}
}
function normUrl(s){s=String(s||'').trim();
  if(/^https?:\/\/\S+$/i.test(s))return safeHttpUrl(s);
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(s))return safeHttpUrl('https://'+s);
  return null;}
function hostOf(u){try{return new URL(u).hostname.toLowerCase().replace(/^(www|m|mobile)\./,'');}catch(e){return '';}}
const AI_HOSTS={'chatgpt.com':'ChatGPT','chat.openai.com':'ChatGPT','claude.ai':'Claude','gemini.google.com':'Gemini','copilot.microsoft.com':'Copilot','chat.deepseek.com':'DeepSeek','poe.com':'Poe','meta.ai':'Meta AI','chat.mistral.ai':'Mistral','notebooklm.google.com':'NotebookLM','notebook.google':'Gemini Notebook','aistudio.google.com':'AI Studio','perplexity.ai':'Perplexity'};
function typeFromUrl(u){
  let url;try{url=new URL(u);}catch(e){return 'outro';}
  const h=hostOf(u),p=url.pathname.toLowerCase();
  const is=(...ds)=>ds.some(d=>h===d||h.endsWith('.'+d));
  if(/^google\.[a-z.]+$/.test(h)&&p.startsWith('/url')){const q=url.searchParams.get('q')||url.searchParams.get('url');const sq=safeHttpUrl(q);if(sq)return typeFromUrl(sq);}
  if(is('grok.com','x.com','twitter.com','t.co','x.ai'))return 'grok';
  if(is('youtube.com','youtu.be'))return 'youtube';
  if(is('instagram.com','instagr.am'))return 'instagram';
  if(is('perplexity.ai','share.google','g.co'))return 'busca';
  if(is(...Object.keys(AI_HOSTS)))return /\/(artifact|artifacts|canvas|public|publish|pub)(\/|$)/.test(p)?'ia':'conversa';
  if(/^google\.[a-z.]+$/.test(h))return p.startsWith('/search')?'busca':'outro';
  if(/(^|\.)google\.[a-z.]+$/.test(h))return 'outro';
  if(is('tiktok.com','vimeo.com','kwai.com','fb.watch'))return 'video';
  if(is('facebook.com')&&/\/(reel|watch|videos)/.test(p))return 'video';
  if(is('spotify.com','music.apple.com','deezer.com','soundcloud.com'))return 'musica';
  if(is('facebook.com','threads.net','whatsapp.com','wa.me'))return 'outro';
  return 'artigo';
}
function titleFromUrl(u){
  let url;try{url=new URL(u);}catch(e){return u;}
  const h=hostOf(u);const segs=url.pathname.split('/').filter(Boolean);
  if(/^google\./.test(h)){const q=url.searchParams.get('q');if(q)return 'Busca: '+q;}
  if((h==='x.com'||h==='twitter.com')&&segs[0]&&!['i','search','home'].includes(segs[0]))return 'Post de @'+segs[0];
  if(h==='grok.com')return 'Conversa no Grok';
  if(h==='instagram.com')return /^(reel|reels|tv)$/.test(segs[0]||'')?'Reels do Instagram':(segs[0]&&segs[0]!=='p'?'Post de @'+segs[0]:'Post do Instagram');
  if(h==='open.spotify.com'||h==='spotify.com')return segs.includes('episode')||segs.includes('show')?'Podcast no Spotify':'Música no Spotify';
  if(h==='tiktok.com')return segs[0]&&segs[0].startsWith('@')?'Vídeo de '+segs[0]:'Vídeo do TikTok';
  if(h==='youtube.com'||h==='youtu.be')return segs[0]==='shorts'?'Shorts do YouTube':'Vídeo do YouTube';
  for(const k in AI_HOSTS){if(h===k||h.endsWith('.'+k)){
    if(k==='perplexity.ai'&&segs[0]==='search'&&segs[1]){const w=segs[1].split('-').filter(x=>!/^[A-Za-z0-9]{10,}$/.test(x));if(w.length>=2){const t=w.join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}}
    return (typeFromUrl(u)==='ia'?'Documento no ':'Conversa no ')+AI_HOSTS[k];}}
  for(let i=segs.length-1;i>=0;i--){
    let s;try{s=decodeURIComponent(segs[i]);}catch(e){s=segs[i];}
    s=s.replace(/\.(html?|php|aspx?)$/i,'');
    const words=s.split(/[-_+]+/).filter(Boolean);
    if(words.length>=3&&/[a-zà-ú]{3}/i.test(s)&&!/^[0-9a-f-]{16,}$/i.test(s)){
      const t=words.join(' ');return t.charAt(0).toUpperCase()+t.slice(1);}
  }
  return h+(segs.length?' / '+segs.slice(0,2).join('/'):'');
}
function titleFromText(t){
  const lines=t.split('\n').map(s=>s.replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/,'').replace(/[*_`]/g,'').trim()).filter(s=>s.length>2&&!/^(vis[aã]o geral (criada|gerada) por ia|ai overview)$/i.test(s)&&!/^https?:\/\/\S+$/i.test(s));
  const line=lines[0]||'Sem título';
  if(line.length<=90)return line;
  const cut=line.slice(0,90);const sp=cut.lastIndexOf(' ');
  return (sp>40?cut.slice(0,sp):cut)+'…';
}
function classifyText(t){
  const lower=t.toLowerCase();
  if(/vis[aã]o geral (criada|gerada) por ia|ai overview|\bmodo ia\b|\bai mode\b/.test(lower))return 'busca';
  const turns=(t.match(/^\s*(voc[eê]|user|usu[aá]rio|eu|chatgpt|claude|grok|gemini|assistant|assistente|ia)\s*(disse|said)?\s*:/gim)||[]).length;
  if(turns>=2||/\b(you said|voc[eê] disse)\b/i.test(t))return 'conversa';
  const md=(t.match(/^#{1,4}\s/gm)||[]).length+((t.match(/^\s*([-*•]|\d+\.)\s/gm)||[]).length>=3?2:0)+(/\*\*[^*\n]+\*\*/.test(t)?1:0);
  if(t.length>500&&md>=2)return 'ia';
  return null;
}
function detect(raw){
  const t=(raw||'').trim();if(!t)return null;
  const single=/\s/.test(t)?null:normUrl(t);
  if(single)return {type:typeFromUrl(single),url:single,body:'',title:titleFromUrl(single),linkShare:true};
  const m=t.match(URL_RE);const url=m?safeHttpUrl(m[0]):null;
  if(url){
    const rest=t.replace(m[0],'').replace(/^[\s:.,|-]+|[\s:.,|-]+$/g,'').trim();
    /* Compartilhamento do iOS/Android ("Título curto https://...") vira link limpo com título real */
    if(!rest)return {type:typeFromUrl(url),url,body:'',title:titleFromUrl(url),linkShare:true};
    if(rest.length<=120&&!rest.includes('\n'))return {type:typeFromUrl(url),url,body:'',title:rest,linkShare:true,keepTitle:true};
  }
  let type=classifyText(t);
  if(!type&&url)type=typeFromUrl(url);
  if(!type)type=t.length>1500?'artigo':'outro';
  return {type,url,body:t,title:titleFromText(t),linkShare:false};
}
function stripMd(t){return t.replace(/```[\s\S]*?```/g,' ').replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/gm,'').replace(/[*_`|]/g,'');}
function excerptOf(t){const s=stripMd(t||'').replace(/\s+/g,' ').trim();return s.length>240?s.slice(0,240).replace(/\s\S*$/,'')+'…':s;}
function wordCount(t){const m=(t||'').trim().match(/\S+/g);return m?m.length:0;}
function speechText(t){return t.replace(/```[\s\S]*?```/g,'\n(bloco de código)\n').replace(/https?:\/\/\S+/g,'link').replace(/^(\s*(#{1,6}|>|[-*•]|\d+[.)])\s+)+/gm,'').replace(/[*_`#|>]/g,'').replace(/^\s*-{3,}\s*$/gm,'');}
function chunkify(text,max){
  const out=[];let pos=0;
  for(const raw of text.split('\n')){
    const para=raw.trim();const at=text.indexOf(raw,pos);pos=at+raw.length;
    if(!para)continue;
    const base=at+raw.indexOf(para);
    if(para.length<=max){out.push({text:para,start:base});continue;}
    const sents=para.split(/(?<=[.!?…;:])\s+/);
    let cur='',curStart=base,off=0;
    const push=()=>{if(cur.trim())out.push({text:cur.trim(),start:curStart});cur='';};
    for(const s of sents){
      const sAt=para.indexOf(s,off);off=sAt+s.length;
      if(s.length>max){push();let rest=s,rAt=sAt;
        while(rest.length>max){let cut=rest.lastIndexOf(' ',max);if(cut<max/2)cut=max;out.push({text:rest.slice(0,cut).trim(),start:base+rAt});rest=rest.slice(cut);rAt+=cut;}
        cur=rest;curStart=base+rAt;continue;}
      if(!cur){cur=s;curStart=base+sAt;}
      else if(cur.length+1+s.length<=max)cur+=' '+s;
      else{push();cur=s;curStart=base+sAt;}
    }
    push();
  }
  return out;
}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function summaryPrompt(it,body,lang){
  const L=lang==='en'?'inglês':'português do Brasil';
  return 'Leia o conteúdo abaixo e responda em '+L+', em tom de conversa, como um amigo que explica rápido.\n'+
    'Responda só com JSON neste formato: {"titulo": "até 8 palavras dizendo do que se trata, sem nome de site ou plataforma", "tese": "uma frase de até 25 palavras com a ideia central", "pontos": ["até 3 pontos, cada um com até 18 palavras"]}\n'+
    'Regras: use só o que está no texto, sem inventar; frases curtas e diretas; sem emoji; sem travessão longo; se for uma conversa, diga o que foi concluído.\n\n'+
    'Tipo: '+((TYPE[it.type]||TYPE.outro).label)+'\n\nTexto:\n'+body.slice(0,24000);
}
function cleanSummary(s){
  if(!s||typeof s!=='object')return null;
  const fix=x=>String(x||'').replace(/\s*[—–]\s*/g,', ').replace(/\s+/g,' ').trim();
  const tese=fix(s.tese);const pontos=Array.isArray(s.pontos)?s.pontos.map(fix).filter(Boolean).slice(0,3):[];
  if(!tese&&!pontos.length)return null;
  const titulo=fix(s.titulo).replace(/[.]$/,'').slice(0,90);
  return {tese,pontos,titulo};
}

/* Feedback tátil real no Android (navigator.vibrate) + pulso acústico curto opcional no iPhone */
let audioCtx=null;
function tapFeedback(kind){
  try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(kind==='ok'?[10,22,12]:8);}catch(e){}
  if(!prefs.som||calm())return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(kind==='ok'?210:155,now);
    osc.frequency.exponentialRampToValueAtTime(kind==='ok'?120:85,now+0.022);
    g.gain.setValueAtTime(0.028,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.024);
    osc.connect(g);g.connect(audioCtx.destination);
    osc.start(now);osc.stop(now+0.025);
  }catch(e){}
}

let db=null,mode='loading',tts=null,sampler=null;

function makeMemoryDb(){
  const cols={},subs={};
  const col=n=>cols[n]||(cols[n]=new Map());
  try{const raw=localStorage.getItem('bp:localdb');if(raw){const o=JSON.parse(raw);for(const n in o)cols[n]=new Map(Object.entries(o[n]));}}catch(e){}
  const persist=()=>{
    try{const o={};for(const n in cols)o[n]=Object.fromEntries(cols[n]);localStorage.setItem('bp:localdb',JSON.stringify(o));localStorage.setItem('bp:localdb:v','1');}
    catch(e){throw {code:'quota_exceeded',message:'localStorage cheio'};}
  };
  const emit=n=>{persist();(subs[n]||[]).forEach(f=>f());};
  const snap=(id,data)=>({id,exists:!!data,data:()=>data,metadata:{fromCache:false,hasPendingWrites:false}});
  const clone=d=>JSON.parse(JSON.stringify(d));
  const docRef=(n,id)=>({id,
    get:async()=>snap(id,col(n).get(id)),
    set:async d=>{col(n).set(id,clone(d));emit(n);},
    update:async d=>{const c=col(n).get(id);if(!c)throw {code:'invalid_argument',message:'missing'};col(n).set(id,Object.assign({},c,clone(d)));emit(n);},
    delete:async()=>{col(n).delete(id);emit(n);}});
  const q=n=>{const o={orderBy:()=>o,limit:()=>o,where:()=>o,
    onSnapshot(next){const f=()=>{const docs=[...col(n)].map(([id,d])=>snap(id,d));next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]});};
      (subs[n]=subs[n]||[]).push(f);setTimeout(f,0);return ()=>{subs[n]=subs[n].filter(x=>x!==f);};},
    doc:id=>docRef(n,id||(Date.now().toString(36)+Math.random().toString(36).slice(2,8)))};return o;};
  return {collection:q,doc:p=>{const s=p.split('/');return docRef(s[0],s[1]);}};
}

function takeShared(){

    if(!text&&!url&&!title)return;

let loadTimer=null;
function subscribe(){
  if(mode==='cloud')loadTimer=setTimeout(()=>{banner('sem conexão com o claude.ai. confira a internet.');},10000);
  db.collection('items').orderBy('createdAt','desc').limit(1000).onSnapshot(snap=>{
    items.clear();
    for(const d of snap.docs){
      const v=d.data();
      if(v){
        if(v.url)v.url=safeHttpUrl(v.url);
        items.set(d.id,Object.assign({id:d.id},v));
      }
    }
    loaded=true;
    if(!snap.metadata.fromCache){clearTimeout(loadTimer);banner('');}
    renderAll();
  },err=>{clearTimeout(loadTimer);banner(errMsg(err));});
  db.collection('wants').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{
    wants.clear();
    for(const d of snap.docs){const v=d.data();if(v)wants.set(d.id,Object.assign({id:d.id},v));}
    renderWants();renderInicio();
  },()=>{});
}

function errMsg(e){const c=e&&e.code;
  if(c==='quota_exceeded')return 'armazenamento cheio. arquive itens antigos.';
  if(c==='invalid_argument')return 'não salvou. texto grande demais.';
  if(c==='unavailable'||c==='resource_exhausted')return 'sem conexão. tente de novo.';
  if(c==='revoked'||c==='not_granted')return 'recarregue a página.';
  return 'não salvou. tente de novo.';}

const queues={};
function patch(id,data,colName){
  colName=colName||'items';const key=colName+'/'+id;
  const q=queues[key]||(queues[key]={pending:null,running:false});
  q.pending=Object.assign(q.pending||{},data,{updatedAt:Date.now()});
  const local=(colName==='items'?items:wants).get(id);if(local)Object.assign(local,data);
  if(q.running)return q.promise;
  q.running=true;
  q.promise=(async()=>{
    try{while(q.pending){const d=q.pending;q.pending=null;await withRetry(()=>db.collection(colName).doc(id).update(d));}}
    catch(e){toast(errMsg(e));throw e;}
    finally{q.running=false;}
  })();
  return q.promise.catch(()=>{});
}
async function withRetry(fn){try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));return fn();}throw e;}}

async function writeBody(id,text){
  const parts=Math.ceil(text.length/PART);
  for(let i=0;i<parts;i++)await withRetry(()=>db.collection('bodies').doc(id+'_'+i).set({text:text.slice(i*PART,(i+1)*PART)}));
  bodies.set(id,text);
  return parts;
}
async function loadBody(it){
  if(bodies.has(it.id))return bodies.get(it.id);
  if(!it.parts)return '';
  const snaps=await Promise.all(Array.from({length:it.parts},(_,i)=>db.collection('bodies').doc(it.id+'_'+i).get()));
  const t=snaps.map(s=>s.exists?(s.data().text||''):'').join('');
  bodies.set(it.id,t);return t;
}

function openCap(v){

function updateCap(){
  const el=$('cap');el.style.height='auto';
  const maxH=Math.round((window.visualViewport?window.visualViewport.height:window.innerHeight)*0.34);
  el.style.height=Math.min(Math.max(el.scrollHeight+2,88),Math.max(120,maxH))+'px';
  const d=detect(el.value);
  const sel=capType||(d&&d.type);
  document.querySelectorAll('[data-captype]').forEach(b=>{
    const on=b.dataset.captype===sel;
    b.setAttribute('aria-pressed',String(on));
    if(on&&b.scrollIntoView&&!$('drawer').hidden)b.scrollIntoView({block:'nearest',inline:'nearest'});
  });
  const blocked=!d||mode==='off'||mode==='loading';
  $('cap-save').disabled=blocked;

  openBtn.hidden=!(d&&d.url);
  openBtn.disabled=blocked;

async function saveCapture(openExternalNow){
  const d=detect($('cap').value);if(!d||!db)return;
  const safeUrl=safeHttpUrl(d.url);
  /* Abre no mesmo gesto do toque para o bloqueador de pop-up do iPhone Safari nunca barrar */
  if(openExternalNow&&safeUrl){
    try{window.open(safeUrl,'_blank','noopener,noreferrer');}catch(e){}
  }
  $('cap-save').disabled=true;$('cap-save-open').disabled=true;
  const type=capType||d.type;const now=Date.now();const day=dayKey();
  const ref=db.collection('items').doc();
  try{
    const parts=d.body?await writeBody(ref.id,d.body):0;
    await withRetry(()=>ref.set({title:d.title,type,url:safeUrl||null,excerpt:excerptOf(d.body),words:wordCount(d.body),parts,note:'',createdAt:now,updatedAt:now,day,step:0,due:addDays(day,OFFSETS[0]),archived:false,done:false,titleAuto:!d.keepTitle}));
    $('cap').value='';capType=null;closeCap();
    tapFeedback('ok');
    const nid=ref.id,tInfo=TYPE[type]||TYPE.outro;
    if(safeUrl&&!d.body&&!d.keepTitle)fetchTitle(nid,safeUrl);
    if(openExternalNow&&safeUrl){
      toast('guardado em '+tInfo.label+'.');
    }else if(d.body){
      openItem(nid);
      toast('guardado em '+tInfo.label+'.');
    }else{
      toast('guardado em '+tInfo.label+'.',()=>openItem(nid),'editar');
    }
  }catch(e){toast(errMsg(e));updateCap();}
}

const all=()=>[...items.values()].filter(i=>!i.archived).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function mins(w,rate){return Math.max(1,Math.round(w/((rate?160*rate:200))));}
function row(it,o){
  o=o||{};const t=TYPE[it.type]||TYPE.outro;const today=dayKey();
  const meta=[t.label];
  if(o.time){const d=new Date(it.createdAt);meta.push(pad(d.getHours())+':'+pad(d.getMinutes()));}else if(!o.noDay)meta.push(fmtDay(it.day,today));
  if(it.words)meta.push(mins(it.words)+' min');
  if(o.due&&it.due)meta.push(it.due<=today?'<span class="tag">lembrar</span>':fmtDay(it.due,today));
  const extUrl=safeHttpUrl(it.url);
  let h='<li><button class="row" type="button" data-open="'+esc(it.id)+'">'+icon(t.icon)+'<span class="rmain"><span class="rtitle">'+esc(it.title)+'</span><span class="rmeta">'+meta.join(' · ')+'</span></span></button>';
  if(extUrl)h+='<a class="ic" href="'+esc(extUrl)+'" target="_blank" rel="noopener noreferrer" aria-label="abrir link original">'+icon('external')+'</a>';
  if(o.check)h+='<button class="ic" type="button" data-done="'+esc(it.id)+'" aria-label="'+(it.done?'voltar para a consumir':'marcar como consumido')+'">'+icon(it.done?'undo':'check')+'</button>';
  if(o.review)h+='<div class="ractions"><button class="btn sm pri" type="button" data-reviewed="'+esc(it.id)+'">'+icon('check')+'lembrei</button><button class="btn sm" type="button" data-snooze="'+esc(it.id)+'">'+icon('clock')+'amanhã</button></div>';
  return h+'</li>';
}
function byDay(list,o){
  let h='',cur=null;const today=dayKey();
  for(const it of list){
    if(it.day!==cur){if(cur!==null)h+='</ul>';cur=it.day;h+='<h3 class="dia">'+fmtDay(it.day,today)+'</h3><ul class="list">';}
    h+=row(it,Object.assign({noDay:true,time:it.day===today},o));
  }
  return h+(cur!==null?'</ul>':'');
}
function placeholder(){
  if(mode==='off')return '<p class="empty">sem acesso aos dados.</p>';
  if(!loaded)return '<p class="empty">carregando…</p>';
  return null;
}
function nextUp(needText){
  const today=dayKey();const a=all().filter(i=>!needText||i.parts||i.note);
  if(P.itemId&&P.state==='paused'&&items.get(P.itemId))return {it:items.get(P.itemId),why:'áudio pausado'};
  const due=a.filter(i=>i.due&&i.due<=today).sort((x,y)=>x.due<y.due?-1:x.due>y.due?1:0);
  if(due.length)return {it:due[0],why:'lembrar hoje'};
  const resume=a.find(i=>lsGet('pos:'+i.id,0)>0||lsGet('scroll:'+i.id,0)>80);
  if(resume)return {it:resume,why:'continuar de onde parou'};
  const todo=a.find(i=>!i.done);
  if(todo)return {it:todo,why:'próximo a consumir'};
  return a[0]?{it:a[0],why:'último guardado'}:null;
}

  const today=dayKey();const a=all();

function linkifyEscaped(s){
  return s.replace(/https?:\/\/[^\s<]+/g,m=>{
    let clean=m,tail='';
    const pm=clean.match(/[.,;:!?)]+$/);
    if(pm){
      let cut=pm[0];
      while(cut.startsWith(')')&&(clean.slice(0,-cut.length).match(/\(/g)||[]).length>(clean.slice(0,-cut.length).match(/\)/g)||[]).length)cut=cut.slice(1);
      if(cut){tail=cut;clean=clean.slice(0,-cut.length);}
    }
    return '<a href="'+clean+'" target="_blank" rel="noopener noreferrer">'+clean+'</a>'+tail;
  });
}
function renderReading(text){
  const inl=s=>linkifyEscaped(esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'));
  const lines=text.replace(/\r/g,'').split('\n');let h='',para=[],list=null;
  const flushP=()=>{if(para.length){h+='<p>'+para.map(inl).join('<br>')+'</p>';para=[];}};
  const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+inl(x)+'</li>').join('')+'</'+list.tag+'>';list=null;}};
  for(const l of lines){
    let m;
    if(!l.trim()){flushP();flushL();continue;}
    if((m=l.match(/^\s*#{1,6}\s+(.*)/))){flushP();flushL();h+='<h3>'+inl(m[1].replace(/\*\*/g,''))+'</h3>';continue;}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(m[1]);continue;}
    flushL();para.push(l.trim());
  }
  flushP();flushL();return h;
}

async function summarize(it,text,refresh){
  if(summarizing.has(it.id)||!sampler)return;
  summarizing.add(it.id);delete summaryErr[it.id];
  try{
    const raw=await sampler.json(summaryPrompt(it,text,it.lang||'pt'),{modelTier:'quick',cache:{gcTime:86400000,refresh:!!refresh}});
    const s=cleanSummary(raw);
    if(!s)throw {code:'invalid_json'};
    const up={summary:{tese:s.tese,pontos:s.pontos}};const now=items.get(it.id);
    if(s.titulo&&now&&now.titleAuto===true)up.title=s.titulo;
    await patch(it.id,up);
  }catch(e){
    const c=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){summaryOff=true;}
    else if(c==='rate_limited')summaryErr[it.id]='limite de uso por agora.';
    else if(c==='session_expired')summaryErr[it.id]='entre de novo no claude.ai.';
    else if(c!=='cancelled')summaryErr[it.id]='não deu para resumir.';
  }finally{
    summarizing.delete(it.id);
    const cur=items.get(it.id);if(cur&&current===it.id)renderResumo(cur);
  }

const P={itemId:null,title:'',chunks:[],idx:0,state:'idle',engine:null,queuedTo:0,token:0,last:0,utter:null};
const hasBrowserVoice='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let claudeVoiceOff=false;
function engineAvailable(e){return e==='claude'?!!tts&&!claudeVoiceOff:hasBrowserVoice;}
function chosenEngine(){if(prefs.engine&&engineAvailable(prefs.engine))return prefs.engine;return engineAvailable('claude')?'claude':(hasBrowserVoice?'browser':null);}
function ptVoices(){if(!hasBrowserVoice)return [];const v=speechSynthesis.getVoices();const pt=v.filter(x=>/^pt/i.test(x.lang));return pt.concat(v.filter(x=>!/^pt/i.test(x.lang)));}
function pickVoice(){const v=ptVoices();return v.find(x=>x.voiceURI===prefs.voice)||v.find(x=>/pt[-_]BR/i.test(x.lang)&&/natural|google|online/i.test(x.name))||v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}
if(hasBrowserVoice){try{speechSynthesis.getVoices();}catch(e){}speechSynthesis.onvoiceschanged=()=>{if(current&&paneMode==='ouvir')fillVoices();};}

async function loadPlayer(it,engine){
  const body=it.parts?await loadBody(it):'';
  const src=speechText((it.title||'')+'.\n'+(body||it.note||''));
  P.itemId=it.id;P.title=it.title;P.engine=engine;
  P.chunks=chunkify(src,engine==='claude'?1500:220);
  const off=lsGet('pos:'+it.id,0);const i=P.chunks.findIndex((c,k)=>k===P.chunks.length-1||P.chunks[k+1].start>off);
  P.idx=Math.max(0,i);P.state='idle';
}
function savePos(){if(P.itemId&&P.chunks[P.idx])lsSet('pos:'+P.itemId,P.chunks[P.idx].start);}
async function playItem(id){
  const it=items.get(id);if(!it)return;
  const engine=chosenEngine();if(!engine){toast('este navegador não lê em voz alta.');return;}
  if(engine==='browser'){try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}}
  bgAudio(true);
  if(P.itemId!==id||P.engine!==engine){stopPlayer(true);bgAudio(true);await loadPlayer(it,engine);}
  if(!P.chunks.length){bgAudio(false);toast('sem texto para ouvir.');return;}
  if(P.idx>=P.chunks.length)P.idx=0;
  startFrom(P.idx);
}
function startFrom(i){
  P.idx=Math.max(0,Math.min(i,P.chunks.length-1));
  if(prefs.awake)keepAwake(true);
  bgAudio(true);
  if(P.engine==='claude'){
    const lines=P.chunks.slice(P.idx,P.idx+60).map((c,k)=>({text:c.text,id:String(P.idx+k)}));
    P.queuedTo=P.idx+lines.length;P.state='starting';
    if(tts.setRate)tts.setRate(clampClaude(prefs.rate));
    tts.speak(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
  }else speakBrowser(P.idx);
  updatePlayerUI();
}
function clampClaude(r){return Math.max(0.7,Math.min(1.5,r));}
function pausePlayer(){
  if(P.state==='idle')return;
  if(P.engine==='claude'){tts.pause().catch(()=>{});}
  else{P.token++;speechSynthesis.cancel();}
  P.state='paused';savePos();keepAwake(false);bgAudio(false);updatePlayerUI();
}
function resumePlayer(){
  if(P.engine==='claude'){if(prefs.awake)keepAwake(true);tts.resume().catch(()=>startFrom(P.idx));P.state='speaking';}
  else startFrom(P.idx);
  updatePlayerUI();
}
function stopPlayer(silent){
  if(P.engine==='claude'&&tts&&P.state!=='idle')tts.stop().catch(()=>{});
  if(P.engine==='browser'&&hasBrowserVoice){P.token++;speechSynthesis.cancel();}
  savePos();P.state='idle';keepAwake(false);bgAudio(false);
  if(!silent){updatePlayerUI();renderInicio();}
}
function finishPlayer(){
  const id=P.itemId;lsSet('pos:'+id,0);P.idx=0;P.state='idle';keepAwake(false);bgAudio(false);updatePlayerUI();
  const it=items.get(id);if(it&&!it.done){patch(id,{done:true});renderAll();toast('fim. marcado como consumido.',()=>{patch(id,{done:false});renderAll();});}else{renderInicio();toast('fim.');}
}
function togglePlayer(id){
  id=id||P.itemId;
  if(P.itemId===id&&(P.state==='speaking'||P.state==='starting'))pausePlayer();
  else if(P.itemId===id&&P.state==='paused')resumePlayer();
  else playItem(id);
}
function jump(d){if(!P.chunks.length)return;const i=Math.max(0,Math.min(P.idx+d,P.chunks.length-1));if(P.state==='idle'||P.state==='paused'){P.idx=i;savePos();updatePlayerUI();}else startFrom(i);}

function speakBrowser(i){
  const my=++P.token;const ss=speechSynthesis;
  if(i>=P.chunks.length){ss.cancel();finishPlayer();return;}
  P.idx=i;P.state='speaking';P.last=Date.now();updatePlayerUI();
  const u=new SpeechSynthesisUtterance(P.chunks[i].text);
  P.utter=u;
  const v=pickVoice();u.lang=v?v.lang.replace('_','-'):'pt-BR';if(v)u.voice=v;u.rate=prefs.rate;
  u.onstart=()=>{if(my===P.token)P.last=Date.now();};
  u.onend=()=>{if(my!==P.token)return;savePos();speakBrowser(i+1);};
  u.onerror=e=>{if(my!==P.token)return;if(e.error==='interrupted'||e.error==='canceled')return;P.state='paused';bgAudio(false);updatePlayerUI();toast('a voz parou. toque em tocar.');};
  const go=()=>{if(my!==P.token)return;try{ss.resume();}catch(e){}ss.speak(u);};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,90);}else go();
}
setInterval(()=>{
  if(P.engine!=='browser'||P.state!=='speaking'||!hasBrowserVoice||document.visibilityState!=='visible')return;
  const ss=speechSynthesis;
  if(!ss.speaking&&!ss.pending&&Date.now()-P.last>2500)speakBrowser(P.idx);
  else if(ss.paused){try{ss.resume();}catch(e){}}
},1500);

function wireTts(){
  tts.onState(({state,reason})=>{
    if(P.engine!=='claude')return;
    if(state!=='idle'){P.state=state;updatePlayerUI();return;}
    if(reason==='replaced')return;
    if(reason==='completed'){if(P.queuedTo<P.chunks.length){topUp(true);return;}finishPlayer();return;}
    P.state=reason==='hidden'?'paused':'idle';savePos();keepAwake(false);
    if(reason==='hidden')toast('pausou porque a tela saiu do app.');
    if(reason==='rate_limited')toast('limite da voz claude. troque para a voz do navegador.');
    if(reason==='not_granted'||reason==='unavailable'){claudeVoiceOff=true;toast('voz claude desligada.');}
    if(reason==='upstream_error')toast('a voz falhou. toque em tocar.');
    updatePlayerUI();renderInicio();
  });
  tts.onLine(({id})=>{if(P.engine!=='claude'||id==null)return;P.idx=+id;savePos();topUp(false);updatePlayerUI();});
}
function topUp(force){
  if(P.engine!=='claude'||P.queuedTo>=P.chunks.length)return;
  if(!force&&P.queuedTo-P.idx>10)return;
  const from=P.queuedTo;const lines=P.chunks.slice(from,from+50).map((c,k)=>({text:c.text,id:String(from+k)}));
  P.queuedTo=from+lines.length;
  tts.add(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
}
function ttsErr(e){
  const c=e&&e.code;if(c==='stopped')return;
  P.state='idle';keepAwake(false);
  if(c==='not_granted'){claudeVoiceOff=true;toast('voz claude desligada. use a voz do navegador.');}
  else if(c==='no_gesture')toast('toque em tocar de novo.');
  else if(c==='busy')toast('microfone em uso. tente já.');
  else if(c==='rate_limited')toast('limite da voz claude. use a voz do navegador.');
  else toast('a voz não respondeu. tente de novo.');
  updatePlayerUI();
}

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
let silent=null;
function bgAudio(on){
  if(mode!=='local')return;
  try{
    if(on){
      if(!silent){
        const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
        const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
        w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
        dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
        silent=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));silent.loop=true;
      }
      const p=silent.play();if(p&&p.catch)p.catch(()=>{});
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata=new MediaMetadata({title:P.title||'biblioteca',artist:'stuff'});
        const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
        h('play',()=>{if(P.state==='paused')resumePlayer();});h('pause',()=>pausePlayer());
        h('nexttrack',()=>jump(1));h('previoustrack',()=>jump(-1));h('stop',()=>stopPlayer());
      }
    }else if(silent)silent.pause();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;

function renderOuvir(){
  const it=items.get(current);const pane=$('pane-ouvir');if(!it||!pane)return;

function fillVoices(){
  const sel=$('p-voice');if(!sel)return;const v=ptVoices();const cur=pickVoice();
  sel.innerHTML=v.length?v.map(x=>'<option value="'+esc(x.voiceURI)+'"'+(cur&&x.voiceURI===cur.voiceURI?' selected':'')+'>'+esc(x.name)+'</option>').join(''):'<option value="">padrão do aparelho</option>';
}
function updatePlayerUI(){
  const active=P.itemId&&P.state!=='idle';
  $('mini').hidden=!active;document.body.classList.toggle('has-mini',!!active);
  const playing=P.state==='speaking'||P.state==='starting';
  if(active){$('mini-t').textContent=P.title;$('mini-s').textContent=(playing?'tocando':'pausado')+' · '+(P.idx+1)+' de '+P.chunks.length;$('mini-toggle').innerHTML=icon(playing?'pause':'play');$('mini-stop').innerHTML=icon('stop');}
  if(!current||!$('p-toggle'))return;
  const mine=P.itemId===current&&P.chunks.length;
  const eng=$('p-engine').value;
  $('p-toggle').innerHTML=icon(mine&&playing?'pause':'play');
  $('p-rate-out').textContent=(eng==='claude'?clampClaude(prefs.rate):prefs.rate).toFixed(2).replace(/0$/,'').replace('.',',')+'x';
  $('p-voice-wrap').hidden=eng!=='browser';
  const it=items.get(current);const w=it?(it.words||wordCount(it.note||'')):0;
  $('p-est').textContent=w?mins(w,eng==='claude'?clampClaude(prefs.rate):prefs.rate)+' min':'';
  if(mine){
    const last=P.chunks[P.chunks.length-1];const len=last.start+last.text.length||1;
    $('p-bar').style.width=Math.round(P.chunks[P.idx].start/len*100)+'%';
    $('p-info').textContent=(P.idx+1)+' de '+P.chunks.length+(P.state==='paused'?' · pausado':'');
    $('p-now').textContent=P.chunks[P.idx].text;
  }else{
    $('p-bar').style.width='0%';$('p-info').textContent='';
    $('p-now').textContent=it?it.title:'';
  }
}

/* ---------- Abertura rápida (livro aberto, máx. 900 ms, 1x por sessão) ---------- */
const BOOK='<svg class="booksvg" viewBox="0 0 80 80" aria-hidden="true"><path class="ln l1" pathLength="1" d="M40 24c-8-6-20-7-28-3v36c8-4 20-3 28 3"/><path class="ln l2" pathLength="1" d="M40 24c8-6 20-7 28-3v36c-8-4-20-3-28 3"/><path class="ln l3" pathLength="1" d="M40 24v36"/></svg>';
const calm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function splash(){
  if(calm())return;
  try{if(sessionStorage.getItem('bp:splash'))return;sessionStorage.setItem('bp:splash','1');}catch(e){}
  const el=document.createElement('div');el.className='splash';el.innerHTML=BOOK+'<div class="sw">stuff</div>';
  document.body.appendChild(el);
  const bye=()=>{el.classList.add('out');setTimeout(()=>el.remove(),240);};
  el.addEventListener('click',bye);setTimeout(bye,850);
}
function copyText(txt,okMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(okMsg)).catch(()=>fallbackCopy(txt,okMsg));
  }else fallbackCopy(txt,okMsg);
}
function fallbackCopy(txt,okMsg){
  try{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(okMsg);
  }catch(e){toast(txt);}
}
function shareApp(){
  const url=location.href.split('#')[0].split('?')[0];
  if(navigator.share){navigator.share({title:'Stuff',url}).catch(()=>{});return;}
  copyText(url,'link copiado.');
}

const OEMBED=[
  [/(^|\.)(youtube\.com|youtu\.be)$/,u=>'https://www.youtube.com/oembed?format=json&url='+u],
  [/(^|\.)spotify\.com$/,u=>'https://open.spotify.com/oembed?url='+u],
  [/(^|\.)tiktok\.com$/,u=>'https://www.tiktok.com/oembed?url='+u],
  [/(^|\.)vimeo\.com$/,u=>'https://vimeo.com/api/oembed.json?url='+u]
];
async function fetchTitle(id,url){
  if(mode!=='local'||!url)return;
  const h=hostOf(url);const m=OEMBED.find(o=>o[0].test(h));if(!m)return;
  try{
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch(m[1](encodeURIComponent(url)),{signal:ctl.signal});clearTimeout(tm);
    if(!r.ok)return;const j=await r.json();
    let t=String(j.title||'').replace(/\s+/g,' ').trim();if(!t)return;
    if(j.author_name&&!t.includes(j.author_name)&&t.length<70)t+=' · '+j.author_name;
    const it=items.get(id);if(!it||it.titleAuto!==true)return;
    await patch(id,{title:t.slice(0,120)});
    const el=$('d-title');if(el&&current===id&&document.activeElement!==el){el.value=t.slice(0,120);growTitle();}
    renderAll();
  }catch(e){}
}
function shareItem(it){
  if(!it)return;
  const lines=[it.title];if(it.summary&&it.summary.tese)lines.push(it.summary.tese);if(it.note)lines.push(it.note);
  const text=lines.join('\n\n');
  const extUrl=safeHttpUrl(it.url);
  if(navigator.share){const d={title:it.title,text};if(extUrl)d.url=extUrl;navigator.share(d).catch(()=>{});return;}
  copyText(text+(extUrl?'\n'+extUrl:''),'copiado para compartilhar.');
}

let toastTimer=null;
function toast(msg,actionFn,actionLabel){
  const t=$('toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(actionFn?'<button type="button" id="toast-undo">'+esc(actionLabel||'desfazer')+'</button>':'');
  t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},actionFn?4800:2400);
  if(actionFn)$('toast-undo').onclick=()=>{t.hidden=true;actionFn();};
}

document.addEventListener('click',e=>{

  if(ds.cons){consTab=ds.cons;renderConsumos();return;}
  if(ds.filter){libFilter=ds.filter;libLimit=60;renderFilters();renderLib();return;}
  if('more' in ds){libLimit+=60;renderLib();return;}
  if(ds.reviewed){markReviewed(ds.reviewed);return;}
  if(ds.snooze){snooze(ds.snooze);return;}

  if(ds.wantdone){const w=wants.get(ds.wantdone);if(w){tapFeedback('tap');patch(w.id,{done:!w.done},'wants');renderWants();renderCounts();}return;}
  if('restart' in ds&&current){tapFeedback('tap');patch(current,{step:0,due:addDays(dayKey(),1)});refreshSheetMeta();renderAll();return;}
  if('close' in ds){closeSheet();return;}
  if(ds.mode){setMode(ds.mode);return;}
  if(ds.lang&&current){const it=items.get(current);if(it){it.lang=ds.lang;patch(current,{lang:ds.lang});$('d-resumo').innerHTML='<div class="lbl"><span>resumo</span></div><p class="mut">resumindo…</p>';loadBody(it).then(t=>summarize(it,t,true));}return;}
  if(ds.resumir&&current){const it=items.get(current);if(!it)return;const box=$('d-resumo');box.innerHTML='<div class="lbl"><span>resumo</span></div><p class="mut">resumindo…</p>';box.hidden=false;loadBody(it).then(t=>summarize(it,t,true));return;}
  if('shareitem' in ds&&current){shareItem(items.get(current));return;}

  if('savebody' in ds&&current){saveBody();return;}

function exportBackup(){
  let data={};try{data=JSON.parse(localStorage.getItem('bp:localdb')||'{}');}catch(e){}
  const n=Object.keys(data.items||{}).length;
  if(!n&&!Object.keys(data.wants||{}).length){toast('nada para exportar.');return;}
  const blob=new Blob([JSON.stringify({app:'stuff',v:1,exportedAt:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stuff-'+dayKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('exportado: '+n+(n===1?' item.':' itens.'));
}
const ALLOWED_COLS=new Set(['items','wants','bodies']);
function sanitizeBackupRecord(col,rec){
  if(!rec||typeof rec!=='object'||Array.isArray(rec))return null;
  if(col==='bodies')return {text:String(rec.text||'')};
  if(col==='wants')return {text:String(rec.text||'').slice(0,500),createdAt:Number(rec.createdAt)||Date.now(),done:!!rec.done};
  const type=TYPE[rec.type]?rec.type:'outro';
  return {
    title:String(rec.title||'Sem título').slice(0,240),
    type,
    url:safeHttpUrl(rec.url),
    excerpt:String(rec.excerpt||'').slice(0,400),
    words:Math.max(0,Number(rec.words)||0),
    parts:Math.max(0,Number(rec.parts)||0),
    note:String(rec.note||''),
    createdAt:Number(rec.createdAt)||Date.now(),
    updatedAt:Number(rec.updatedAt)||Date.now(),
    day:/^\d{4}-\d{2}-\d{2}$/.test(String(rec.day||''))?rec.day:dayKey(),
    step:Math.max(0,Math.min(OFFSETS.length,Number(rec.step)||0)),
    due:rec.due&&/^\d{4}-\d{2}-\d{2}$/.test(String(rec.due))?rec.due:null,
    archived:!!rec.archived,
    done:!!rec.done,
    titleAuto:!!rec.titleAuto,
    summary:cleanSummary(rec.summary)||undefined
  };
}
function mergeBackup(text){
  let o;try{o=JSON.parse(text);}catch(e){return -1;}
  const inc=o&&o.app==='stuff'&&o.data&&typeof o.data==='object'?o.data:null;if(!inc)return -1;
  let cur={};try{cur=JSON.parse(localStorage.getItem('bp:localdb')||'{}');}catch(e){}
  let add=0;
  for(const col of Object.keys(inc)){
    if(!ALLOWED_COLS.has(col))continue;
    const src=inc[col];if(!src||typeof src!=='object'||Array.isArray(src))continue;
    const dst=cur[col]&&typeof cur[col]==='object'?cur[col]:(cur[col]={});
    for(const id of Object.keys(src)){
      if(id==='__proto__'||id==='constructor'||id==='prototype'||id in dst)continue;
      const clean=sanitizeBackupRecord(col,src[id]);
      if(clean){dst[id]=clean;add++;}
    }
  }
  if(add){try{localStorage.setItem('bp:localdb',JSON.stringify(cur));localStorage.setItem('bp:localdb:v','1');}catch(e){return -2;}}
  return add;
}
async function saveBody(){
  const it=items.get(current);const el=$('d-body');if(!it||!el)return;const text=el.value.trim();if(!text)return;
  try{const parts=await writeBody(it.id,text);await patch(it.id,{parts,words:wordCount(text),excerpt:excerptOf(text)});tapFeedback('ok');renderLer();}
  catch(e){toast(errMsg(e));}
}
document.addEventListener('input',e=>{

});
document.addEventListener('change',e=>{

document.addEventListener('keydown',e=>{
