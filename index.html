function thumbDe(it){const u=safeHttpUrl(it.url);const md=u?midia(u):null;return (md&&md.thumb)||(it.thumb&&safeHttpUrl(it.thumb))||'';}
const logoSvg=k=>LOGOS[k]?'<svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><path d="'+LOGOS[k]+'"/></svg>':'';
function capaMini(it,cls){
  const th=thumbDe(it);const lg=logoDe(it);const t=TYPE[it.type]||TYPE.outro;

function umDado(it,o){

function row(it,o){

  let h='<li class="ficha" data-swipe="'+esc(it.id)+'" style="--lomb:'+lomb(it)+';--i:'+(o.i||0)+'"><div class="rastro" aria-hidden="true"><span>'+(it.done?'a consumir':'consumido')+'</span><span>lembrar</span></div>'+
    /* v5 (K14): tocar na linha abre o link direto; a ficha fica nos três pontos */
    (extUrl&&!it.pag?'<a class="row" href="'+esc(extUrl)+'" target="_blank" rel="noopener noreferrer" data-consumir="'+esc(it.id)+'">':'<button class="row" type="button" data-open="'+esc(it.id)+'">')+

function capa(it,i){

  const due=a.filter(i=>i.due&&i.due<=today).sort((x,y)=>x.due<y.due?-1:x.due>y.due?1:0);
  if(due.length)return {it:due[0],why:'lembrar hoje'};
  const resume=a.find(i=>lsGet('pos:'+i.id,0)>0||lsGet('scroll:'+i.id,0)>80);
  if(resume)return {it:resume,why:'continuar de onde parou'};
  const todo=a.find(i=>!i.done);
  if(todo)return {it:todo,why:'próximo a consumir'};
  return a[0]?{it:a[0],why:'último guardado'}:null;
}

let current=null,paneMode='ler',noteTimer=null,scrollTimer=null;
function linkifyEscaped(s){
  return s.replace(/https?:\/\/[^\s<]+/g,m=>{
    let clean=m,tail='';
    const pm=clean.match(/[.,;:!?)]+$/);
    if(pm){
      let cut=pm[0];
      while(cut.startsWith(')')&&(clean.slice(0,-cut.length).match(/\(/g)||[]).length>(clean.slice(0,-cut.length).match(/\)/g)||[]).length)cut=cut.slice(1);
      if(cut){tail=cut;clean=clean.slice(0,-cut.length);}
    }
    return '<a href="'+clean+'" target="_blank" rel="noopener noreferrer">'+clean+'</a>'+tail;
  });
}
function renderReading(text){
  const inl=s=>linkifyEscaped(esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'));
  const lines=text.replace(/\r/g,'').split('\n');let h='',para=[],list=null;
  const flushP=()=>{if(para.length){h+='<p>'+para.map(inl).join('<br>')+'</p>';para=[];}};
  const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+inl(x)+'</li>').join('')+'</'+list.tag+'>';list=null;}};
  for(const l of lines){
    let m;
    if(!l.trim()){flushP();flushL();continue;}
    if((m=l.match(/^\s*#{1,6}\s+(.*)/))){flushP();flushL();h+='<h3>'+inl(m[1].replace(/\*\*/g,''))+'</h3>';continue;}
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(m[1]);continue;}
    flushL();para.push(l.trim());
  }
  flushP();flushL();return h;
}
/* Onde o conteúdo pode tocar aqui mesmo (só carrega ao toque) */
function midia(u){
  let url;try{url=new URL(u);}catch(e){return null;}
  const h=hostOf(u),p=url.pathname;let m;
  if(h==='youtu.be')m=p.slice(1).split('/')[0];
  else if(/(^|\.)youtube\.com$/.test(h))m=url.searchParams.get('v')||(p.match(/^\/(shorts|embed|live)\/([\w-]{6,})/)||[])[2];
  if(m&&/^[\w-]{6,20}$/.test(m))return {embed:'https://www.youtube-nocookie.com/embed/'+m+'?autoplay=1&rel=0',thumb:'https://i.ytimg.com/vi/'+m+'/hqdefault.jpg',video:true};
  if(/(^|\.)vimeo\.com$/.test(h)&&(m=p.match(/^\/(\d+)/)))return {embed:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',video:true};
  if(/(^|\.)spotify\.com$/.test(h)&&(m=p.match(/\/(track|episode|album|playlist|show)\/(\w+)/)))return {embed:'https://open.spotify.com/embed/'+m[1]+'/'+m[2],alto:m[1]==='track'?152:352};
  if(/(^|\.)instagram\.com$/.test(h)&&(m=p.match(/^\/(p|reel|reels|tv)\/([\w-]+)/)))return {embed:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed/',alto:580};
  if(/(^|\.)(x|twitter)\.com$/.test(h)&&(m=p.match(/\/status\/(\d+)/)))return {embed:'https://platform.twitter.com/embed/Tweet.html?id='+m[1]+'&dnt=true',alto:560};
  if(/(^|\.)tiktok\.com$/.test(h)&&(m=p.match(/\/video\/(\d+)/)))return {embed:'https://www.tiktok.com/embed/v2/'+m[1],alto:620};
  return null;
}

async function summarize(it,text,refresh){

    if(!s)throw {code:'invalid_json'};

    if(s.titulo&&now&&now.titleAuto===true)up.title=s.titulo;

  }catch(e){

const P={itemId:null,title:'',chunks:[],idx:0,state:'idle',engine:null,queuedTo:0,token:0,last:0,utter:null};
const hasBrowserVoice='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
let claudeVoiceOff=false;
function engineAvailable(e){return e==='claude'?!!tts&&!claudeVoiceOff:hasBrowserVoice;}
function chosenEngine(){if(prefs.engine&&engineAvailable(prefs.engine))return prefs.engine;return engineAvailable('claude')?'claude':(hasBrowserVoice?'browser':null);}
function ptVoices(){if(!hasBrowserVoice)return [];const v=speechSynthesis.getVoices();const pt=v.filter(x=>/^pt/i.test(x.lang));return pt.concat(v.filter(x=>!/^pt/i.test(x.lang)));}
function pickVoice(){const v=ptVoices();return v.find(x=>x.voiceURI===prefs.voice)||v.find(x=>/pt[-_]BR/i.test(x.lang)&&/natural|google|online/i.test(x.name))||v.find(x=>/pt[-_]BR/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null;}
if(hasBrowserVoice){try{speechSynthesis.getVoices();}catch(e){}speechSynthesis.onvoiceschanged=()=>{if(current&&paneMode==='ouvir')fillVoices();};}

async function loadPlayer(it,engine){
  const body=it.parts?await loadBody(it):'';
  const src=speechText((it.title||'')+'.\n'+(body||it.note||''));
  P.itemId=it.id;P.title=it.title;P.engine=engine;
  P.chunks=chunkify(src,engine==='claude'?1500:220);
  const off=lsGet('pos:'+it.id,0);const i=P.chunks.findIndex((c,k)=>k===P.chunks.length-1||P.chunks[k+1].start>off);
  P.idx=Math.max(0,i);P.state='idle';
}
function savePos(){if(P.itemId&&P.chunks[P.idx])lsSet('pos:'+P.itemId,P.chunks[P.idx].start);}
async function playItem(id){
  const it=items.get(id);if(!it)return;
  const engine=chosenEngine();if(!engine){toast('este navegador não lê em voz alta.');return;}
  if(engine==='browser'){try{speechSynthesis.cancel();speechSynthesis.resume();}catch(e){}}
  bgAudio(true);
  if(P.itemId!==id||P.engine!==engine){stopPlayer(true);bgAudio(true);await loadPlayer(it,engine);}
  if(!P.chunks.length){bgAudio(false);toast('sem texto para ouvir.');return;}
  if(P.idx>=P.chunks.length)P.idx=0;
  startFrom(P.idx);
}
function startFrom(i){
  P.idx=Math.max(0,Math.min(i,P.chunks.length-1));
  if(prefs.awake)keepAwake(true);
  bgAudio(true);
  if(P.engine==='claude'){
    const lines=P.chunks.slice(P.idx,P.idx+60).map((c,k)=>({text:c.text,id:String(P.idx+k)}));
    P.queuedTo=P.idx+lines.length;P.state='starting';
    if(tts.setRate)tts.setRate(clampClaude(prefs.rate));
    tts.speak(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
  }else speakBrowser(P.idx);
  updatePlayerUI();
}
function clampClaude(r){return Math.max(0.7,Math.min(1.5,r));}
function pausePlayer(){
  if(P.state==='idle')return;
  if(P.engine==='claude'){tts.pause().catch(()=>{});}
  else{P.token++;speechSynthesis.cancel();}
  P.state='paused';savePos();keepAwake(false);bgAudio(false);updatePlayerUI();
}
function resumePlayer(){
  if(P.engine==='claude'){if(prefs.awake)keepAwake(true);tts.resume().catch(()=>startFrom(P.idx));P.state='speaking';}
  else startFrom(P.idx);
  updatePlayerUI();
}
function stopPlayer(silent){
  if(P.engine==='claude'&&tts&&P.state!=='idle')tts.stop().catch(()=>{});
  if(P.engine==='browser'&&hasBrowserVoice){P.token++;speechSynthesis.cancel();}
  savePos();P.state='idle';keepAwake(false);bgAudio(false);
  if(!silent){updatePlayerUI();renderInicio();}
}
function finishPlayer(){
  const id=P.itemId;lsSet('pos:'+id,0);P.idx=0;P.state='idle';keepAwake(false);bgAudio(false);updatePlayerUI();
  const it=items.get(id);if(it&&!it.done){patch(id,{done:true});renderAll();toast('fim. marcado como consumido.',()=>{patch(id,{done:false});renderAll();});}else{renderInicio();toast('fim.');}
}
function togglePlayer(id){
  id=id||P.itemId;
  if(P.itemId===id&&(P.state==='speaking'||P.state==='starting'))pausePlayer();
  else if(P.itemId===id&&P.state==='paused')resumePlayer();
  else playItem(id);
}
function jump(d){if(!P.chunks.length)return;const i=Math.max(0,Math.min(P.idx+d,P.chunks.length-1));if(P.state==='idle'||P.state==='paused'){P.idx=i;savePos();updatePlayerUI();}else startFrom(i);}

function speakBrowser(i){
  const my=++P.token;const ss=speechSynthesis;
  if(i>=P.chunks.length){ss.cancel();finishPlayer();return;}
  P.idx=i;P.state='speaking';P.last=Date.now();updatePlayerUI();
  const u=new SpeechSynthesisUtterance(P.chunks[i].text);
  P.utter=u;
  const v=pickVoice();u.lang=v?v.lang.replace('_','-'):'pt-BR';if(v)u.voice=v;u.rate=prefs.rate;
  u.onstart=()=>{if(my===P.token)P.last=Date.now();};
  u.onend=()=>{if(my!==P.token)return;savePos();speakBrowser(i+1);};
  u.onerror=e=>{if(my!==P.token)return;if(e.error==='interrupted'||e.error==='canceled')return;P.state='paused';bgAudio(false);updatePlayerUI();toast('a voz parou. toque em tocar.');};
  const go=()=>{if(my!==P.token)return;try{ss.resume();}catch(e){}ss.speak(u);};
  if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,90);}else go();
}
setInterval(()=>{
  if(P.engine!=='browser'||P.state!=='speaking'||!hasBrowserVoice||document.visibilityState!=='visible')return;
  const ss=speechSynthesis;
  if(!ss.speaking&&!ss.pending&&Date.now()-P.last>2500)speakBrowser(P.idx);
  else if(ss.paused){try{ss.resume();}catch(e){}}
},1500);

function wireTts(){
  tts.onState(({state,reason})=>{
    if(P.engine!=='claude')return;
    if(state!=='idle'){P.state=state;updatePlayerUI();return;}
    if(reason==='replaced')return;
    if(reason==='completed'){if(P.queuedTo<P.chunks.length){topUp(true);return;}finishPlayer();return;}
    P.state=reason==='hidden'?'paused':'idle';savePos();keepAwake(false);
    if(reason==='hidden')toast('pausou porque a tela saiu do app.');
    if(reason==='rate_limited')toast('limite da voz claude. troque para a voz do navegador.');
    if(reason==='not_granted'||reason==='unavailable'){claudeVoiceOff=true;toast('voz claude desligada.');}
    if(reason==='upstream_error')toast('a voz falhou. toque em tocar.');
    updatePlayerUI();renderInicio();
  });
  tts.onLine(({id})=>{if(P.engine!=='claude'||id==null)return;P.idx=+id;savePos();topUp(false);updatePlayerUI();});
}
function topUp(force){
  if(P.engine!=='claude'||P.queuedTo>=P.chunks.length)return;
  if(!force&&P.queuedTo-P.idx>10)return;
  const from=P.queuedTo;const lines=P.chunks.slice(from,from+50).map((c,k)=>({text:c.text,id:String(from+k)}));
  P.queuedTo=from+lines.length;
  tts.add(lines,{rate:clampClaude(prefs.rate)}).catch(ttsErr);
}
function ttsErr(e){
  const c=e&&e.code;if(c==='stopped')return;
  P.state='idle';keepAwake(false);
  if(c==='not_granted'){claudeVoiceOff=true;toast('voz claude desligada. use a voz do navegador.');}
  else if(c==='no_gesture')toast('toque em tocar de novo.');
  else if(c==='busy')toast('microfone em uso. tente já.');
  else if(c==='rate_limited')toast('limite da voz claude. use a voz do navegador.');
  else toast('a voz não respondeu. tente de novo.');
  updatePlayerUI();
}

let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}
let silent=null;
function bgAudio(on){
  if(mode!=='local')return;
  try{
    if(on){
      if(!silent){
        const n=8000,b=new Uint8Array(44+n),dv=new DataView(b.buffer);

const ALLOWED_COLS=new Set(['items','wants','bodies','shelves']);
function sanitizeBackupRecord(col,rec){
  if(!rec||typeof rec!=='object'||Array.isArray(rec))return null;
  if(col==='bodies')return {text:String(rec.text||'')};
  if(col==='wants')return {text:String(rec.text||'').slice(0,500),createdAt:Number(rec.createdAt)||Date.now(),done:!!rec.done};
  if(col==='shelves')return {name:String(rec.name||'estante').slice(0,40),cor:CORES.includes(rec.cor)?rec.cor:CORES[0],order:Number(rec.order)||0,createdAt:Number(rec.createdAt)||Date.now()};
  const type=TYPE[rec.type]?rec.type:'outro';
  return {
    title:String(rec.title||'Sem título').slice(0,240),
    type,
    url:safeHttpUrl(rec.url),
    excerpt:String(rec.excerpt||'').slice(0,400),
    words:Math.max(0,Number(rec.words)||0),
    parts:Math.max(0,Number(rec.parts)||0),
    note:String(rec.note||''),
    createdAt:Number(rec.createdAt)||Date.now(),
    updatedAt:Number(rec.updatedAt)||Date.now(),
    day:/^\d{4}-\d{2}-\d{2}$/.test(String(rec.day||''))?rec.day:dayKey(),
    step:Math.max(0,Math.min(OFFSETS.length,Number(rec.step)||0)),
    due:rec.due&&/^\d{4}-\d{2}-\d{2}$/.test(String(rec.due))?rec.due:null,
    archived:!!rec.archived,
    done:!!rec.done,
    titleAuto:!!rec.titleAuto,
    manual:!!rec.manual,
    pag:rec.pag&&typeof rec.pag==='object'?{tipo:['pix','boleto','texto'].includes(rec.pag.tipo)?rec.pag.tipo:'texto',codigo:String(rec.pag.codigo||'').slice(0,600),valor:Number.isFinite(+rec.pag.valor)&&rec.pag.valor!==null?+rec.pag.valor:null,quem:String(rec.pag.quem||'').slice(0,60),venc:/^\d{4}-\d{2}-\d{2}$/.test(String(rec.pag.venc||''))?rec.pag.venc:null,pago:!!rec.pag.pago}:undefined,
    cor:CORES.includes(rec.cor)?rec.cor:undefined,
    thumb:safeHttpUrl(rec.thumb)||undefined,
    shelves:Array.isArray(rec.shelves)?rec.shelves.map(String).filter(x=>/^[A-Za-z0-9_-]{1,40}$/.test(x)).slice(0,30):[],
    summary:cleanSummary(rec.summary)||undefined
  };
}
function mergeBackup(text){
  let o;try{o=JSON.parse(text);}catch(e){return -1;}
  const inc=o&&(o.app==='talse'||o.app==='stuff')&&o.data&&typeof o.data==='object'?o.data:null;if(!inc)return -1;
  let cur={};try{cur=JSON.parse(localStorage.getItem('bp:localdb')||'{}');}catch(e){}
  let add=0;
  for(const col of Object.keys(inc)){
    if(!ALLOWED_COLS.has(col))continue;
    const src=inc[col];if(!src||typeof src!=='object'||Array.isArray(src))continue;
    const dst=cur[col]&&typeof cur[col]==='object'?cur[col]:(cur[col]={});
    for(const id of Object.keys(src)){
      if(id==='__proto__'||id==='constructor'||id==='prototype'||id in dst)continue;
      const clean=sanitizeBackupRecord(col,src[id]);
      if(clean){dst[id]=clean;add++;}
    }
  }
  if(add){try{localStorage.setItem('bp:localdb',JSON.stringify(cur));localStorage.setItem('bp:localdb:v','1');}catch(e){return -2;}}
  return add;
}

/* Abertura de 3,4 s, toque pula (D4 revisada): o céu sai do preto para a cor, estrelas convergem no fantasma, "talse" sobe */
function abertura(){
  return new Promise(res=>{
    const a=$('abertura');
    if(calm()){res();return;}
    const n=innerWidth<600?46:80;let est='';
    for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,r=(.45+Math.random()*.6)*Math.max(innerWidth,innerHeight)*.62;
      est+='<i style="--x:'+Math.round(Math.cos(ang)*r)+'px;--y:'+Math.round(Math.sin(ang)*r)+'px;--s:'+(1+Math.random()*2.4).toFixed(1)+'px;--d:'+(1.1+Math.random()*.9).toFixed(2)+'s;--w:'+(Math.random()*.7).toFixed(2)+'s"></i>';}
    a.innerHTML='<div class="ab-estrelas">'+est+'</div><div class="ab-luz"></div>'+FANTASMA+'<div class="ab-nome">'+[...'talse'].map((c,k)=>'<span style="--k:'+k+'">'+c+'</span>').join('')+'</div>'+
      '<div class="ab-carga mono"><span>abrindo a sala</span><i><b></b></i><span class="ab-pct">0%</span></div>';
    /* v5: barra e porcentagem animadas só em CSS (fio do compositor): não travam enquanto a sala 3D monta */
    a.hidden=false;a.classList.remove('sai');document.body.classList.add('abrindo');if(window.Ceu)window.Ceu.abrir();
    let feito=false;
    const fim=()=>{if(feito)return;feito=true;a.classList.add('sai');setTimeout(()=>{a.hidden=true;a.innerHTML='';document.body.classList.remove('abrindo');if(window.Ceu)window.Ceu.cores();},420);res();};
    a.onclick=fim;setTimeout(fim,3400);
  });
}
/* ---------- Céu vivo (C6, ref. skylrk.com): degradê em WebGL que muda de cor ao abrir e deriva devagar ---------- */
function iniciarCeu(){
  const c=$('ceu');if(!c)return;
  let gl=null;try{gl=c.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false,powerPreference:'low-power'});}catch(e){}
  if(!gl){document.body.classList.add('sem-ceu');return;}
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float;uniform vec2 r;uniform float t,abre;uniform vec3 base,ca,cb,cc;uniform vec2 m;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){vec2 uv=gl_FragCoord.xy/r;vec2 asp=vec2(r.x/r.y,1.);float k=smoothstep(0.,1.,abre);
      vec2 p1=vec2(.18+.14*sin(t*.07),.92+.08*cos(t*.09))+m*.04;vec2 p2=vec2(.9+.08*cos(t*.06),.12+.1*sin(t*.08))-m*.03;vec2 p3=vec2(.6+.25*sin(t*.045+1.),.55+.2*cos(t*.05));
      float d1=length((uv-p1)*asp),d2=length((uv-p2)*asp),d3=length((uv-p3)*asp);
      vec3 c=base;c=mix(c,ca,k*smoothstep(1.05,0.,d1));c=mix(c,cb,k*smoothstep(.95,0.,d2));c=mix(c,cc,k*.55*smoothstep(.7,0.,d3));
      c+=(h(gl_FragCoord.xy+fract(t)*91.)-.5)*.03;gl_FragColor=vec4(c,1.);}`));
  gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){document.body.classList.add('sem-ceu');return;}
  gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);const u={r:U('r'),t:U('t'),abre:U('abre'),base:U('base'),ca:U('ca'),cb:U('cb'),cc:U('cc'),m:U('m')};
  const hex=s=>{s=String(s).trim().replace('#','');if(s.length===3)s=s.split('').map(x=>x+x).join('');const n=parseInt(s,16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
  const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
  let alvo=null,atual=null,t0=performance.now(),abreT0=performance.now(),raf=0,ult=0,mx=0,my=0;
  function paleta(){
    const acc=hex(getComputedStyle(document.documentElement).getPropertyValue('--acc')||'#22C7F0');
    const escuro=document.body.classList.contains('abrindo')||prefs.tema!=='claro';
    if(escuro)return {base:[0,0,0],ca:acc.map(v=>v*.2),cb:[.11,.05,.22],cc:mix(acc,[.3,.15,.8],.5).map(v=>v*.14)};
    return {base:[1,1,1],ca:mix([1,1,1],acc,.28),cb:mix([1,1,1],[.56,.48,1],.2),cc:mix([1,1,1],acc,.12)};
  }
  function tam(){const k=innerWidth<700?.5:.6;c.width=Math.max(2,Math.round(innerWidth*k));c.height=Math.max(2,Math.round(innerHeight*k));gl.viewport(0,0,c.width,c.height);}
  function desenha(agora){
    const tt=(agora-t0)/1000;const ab=calm()?1:Math.min(1,(agora-abreT0)/4000);
    if(alvo){if(!atual)atual=JSON.parse(JSON.stringify(alvo));const k=Math.min(1,(agora-(ult||agora))/600);for(const n in alvo)atual[n]=mix(atual[n],alvo[n],k);}
    gl.uniform2f(u.r,c.width,c.height);gl.uniform1f(u.t,calm()?0:tt);gl.uniform1f(u.abre,ab);gl.uniform2f(u.m,mx,my);
    gl.uniform3fv(u.base,atual.base);gl.uniform3fv(u.ca,atual.ca);gl.uniform3fv(u.cb,atual.cb);gl.uniform3fv(u.cc,atual.cc);
    gl.drawArrays(gl.TRIANGLES,0,3);ult=agora;
  }
  /* 30 quadros por segundo bastam; parado quando a sala cobre tudo ou a aba some */
  function laco(agora){raf=0;if(document.hidden)return;const coberto=!$('porta').hidden&&!document.body.classList.contains('abrindo');
    if(!coberto&&agora-ult>=33)desenha(agora);if(!calm())raf=requestAnimationFrame(laco);}
  function liga(){if(!raf)raf=requestAnimationFrame(laco);}
  addEventListener('resize',()=>{tam();desenha(performance.now());});
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=.5-e.clientY/innerHeight;},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)liga();});
  tam();alvo=paleta();atual=null;desenha(performance.now());c.classList.add('on');document.body.classList.add('ceu-ok');liga();
  window.Ceu={cores(){alvo=paleta();liga();if(calm())desenha(performance.now());},abrir(){abreT0=performance.now();alvo=paleta();atual=JSON.parse(JSON.stringify(alvo));liga();}};
}

/* Página que sai do objeto tocado (M4): um papel cresce do ponto e vira a tela 2D */
function pagina(x,y,cobre){
  return new Promise(res=>{
    if(calm()){res();return;}
    const d=document.createElement('div');d.className='pagina';d.style.setProperty('--x',(x==null?innerWidth/2:x)+'px');d.style.setProperty('--y',(y==null?innerHeight/2:y)+'px');
    document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('abre'));
    setTimeout(()=>{res();if(cobre)cobre();setTimeout(()=>{d.classList.add('some');setTimeout(()=>d.remove(),360);},40);},430);
  });
}
function irDaSala(v,x,y){
  tapFeedback('tap');
  if(v==='ajustes'){renderAjustes();return;}
  pagina(x,y,()=>{fecharPorta();location.hash=v;route();});
}
function abrirPorta(x,y){
  const p=$('porta');
  const mostra=()=>{p.classList.remove('sai');p.hidden=false;document.body.style.overflow='hidden';renderPoster();renderDoca();
    if(cena){cena.resume();return;}
    if(cenaTentou||calm()||!webglOk()){p.classList.add('plana');return;}
    cenaTentou=true;
    const go=()=>window.TalseScene.mount($('porta-c'),cenaApi).then(c=>{if(!c){p.classList.add('plana');return;}cena=c;if(!$('porta').hidden)p.classList.add('viva');else c.pause();}).catch(()=>{cenaTentou=false;p.classList.add('plana');});
    if(window.TalseScene)go();else window.addEventListener('talse-scene',go,{once:true});};
  if(x!=null&&!p.hidden)return;
  if(x!=null)pagina(x,y,mostra);else mostra();
}

function mostrarTermo(on){
  const old=document.querySelector('#porta .term3d');if(old)old.remove();
  if(!on)return null;
  const t=document.createElement('form');t.className='term3d termo-f';t.setAttribute('autocomplete','off');
  t.innerHTML='<div class="bar mono"><span>[ talse / guardar ]</span><button type="button" data-termofecha aria-label="fechar o terminal">'+icon('x')+'</button></div>'+
    '<div class="termo" style="border:0;padding:0;margin:0"><label for="termo-3d">›</label><input id="termo-3d" placeholder="cole um link, Pix ou boleto" aria-label="colar um link para guardar"><button type="submit">guardar</button></div>';
  $('porta').appendChild(t);
  const inp=t.querySelector('input');
  inp.addEventListener('paste',e=>{const x=(e.clipboardData&&e.clipboardData.getData('text'))||'';if(x&&(normUrl(x.trim())||detectPagamento(x))){e.preventDefault();inp.value=x.trim();termoGuardar(t);}});
  setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},60);
  return t;
}
async function termoGuardar(f){
  const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;
  if(!detect(v)){toast('cole um link, Pix ou texto.');return;}
  inp.value='';inp.placeholder='guardando…';
  try{const r=await saveText(v,{quiet:true});inp.placeholder='guardado. cole outro';if(r){if(cena)cena.chegou(r.id);else renderPoster();renderDoca();toast('guardado em '+(TYPE[r.type]||TYPE.outro).label+'.');}}
  catch(e){inp.value=v;inp.placeholder='cole um link';toast(errMsg(e));}
}

  const old=document.querySelector('#porta .livro3d');if(old)old.remove();

  /* ---------- câmera e etiquetas com linha (I2) ---------- */
  const camPos=new T.Vector3(),camAlvo=new T.Vector3(),querPos=new T.Vector3(),querAlvo=new T.Vector3();
  let modo='sala',px=0,py=0,W=1,H=1;
  function base(){const a=W/H;cam.fov=a<.8?64:a<1.25?54:50;cam.updateProjectionMatrix();
    if(a<.8)return {pos:[.05,1.62,4.1],alvo:[.15,1.3,-.6]};if(a<1.25)return {pos:[.25,2.05,4.2],alvo:[.3,.95,-.6]};return {pos:[.25,2.0,3.85],alvo:[.35,.92,-.6]};}

  function redimensionar(){W=canvas.clientWidth||innerWidth;H=canvas.clientHeight||innerHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();if(modo==='sala')irBase();else if(modo==='monitor')mirarMonitor();}
  const hots=api.hots();hots.innerHTML='<svg class="linhas" aria-hidden="true"></svg>';const svgL=hots.firstChild;
  const rotulos=[
    {k:'monitor',p:new T.Vector3(MON.x,MON.y+.34,MON.z),dx:-70,dy:-46,html:()=>'guardar'},
    {k:'agenda',p:new T.Vector3(2.55,1.78,-2.24),dx:-120,dy:-30,html:()=>'agenda'},
    {k:'estante',p:new T.Vector3(-2.4,1.2,-2.0),dx:-30,dy:-60,html:()=>'estante'},
    {k:'ajustes',p:FAN.position.clone().add(new T.Vector3(0,.5,0)),dx:40,dy:-40,html:()=>'ajustes',so:true}
  ];
  for(const r of rotulos){const b=document.createElement('button');b.type='button';b.className='etq';b.innerHTML=r.html();r.el=b;hots.appendChild(b);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','3');svgL.appendChild(ln);svgL.appendChild(dot);r.ln=ln;r.dot=dot;
    b.addEventListener('click',e=>{e.stopPropagation();const rc=b.getBoundingClientRect();if(r.k==='monitor')focarMonitor();else api.go(r.k,rc.left+rc.width/2,rc.top+rc.height/2);});}
  const vtmp=new T.Vector3();let sobreK=null;

      const mostra=vis&&vtmp.z<1&&(coarse?!r.so:(!r.so||sobreK==='fantasma'));

      r.ln.setAttribute('x1',x);r.ln.setAttribute('y1',y);r.ln.setAttribute('x2',tx+(r.dx<0?r.el.offsetWidth:0));r.ln.setAttribute('y2',ty+22);r.ln.style.opacity=mostra?'1':'0';
      r.dot.setAttribute('cx',x);r.dot.setAttribute('cy',y);r.dot.style.opacity=mostra?'1':'0';
    }
  }
  function posicionarTermo(){
    const f=porta.querySelector('.term3d');if(!f)return;

  }

  /* ---------- toque ---------- */
  const ray=new T.Raycaster(),ptr=new T.Vector2();let baixo=null;
  const fixos=[{o:poster,k:'poster'},{o:telaMon,k:'monitor'},{o:cal,k:'agenda'},{o:envAlvo,k:'envelope'},{o:fanAlvo,k:'fantasma'},{o:tabTela,k:'tab'},{o:celTela,k:'cel'},{o:vidro,k:'janela'},{o:kinTela,k:'kindle'}];
  function pegar(cx,cy){
    const r=canvas.getBoundingClientRect();ptr.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(ptr,cam);
    const hit=ray.intersectObjects([...livros.values(),...fixos.map(a=>a.o)],true)[0];if(!hit)return null;
    const f=fixos.find(a=>a.o===hit.object||(a.grupo&&hit.object.parent&&a.o===hit.object.parent));if(f)return {k:f.k,o:hit.object,uv:hit.uv};
    let o=hit.object;while(o&&!(o.userData&&o.userData.tipo==='livro'))o=o.parent;if(!o)return null;return {k:'livro',o,id:o.userData.id};
  }
  let sobre=null;
  canvas.addEventListener('pointermove',e=>{

    if(modo==='monitor'){
      if(h&&h.k==='monitor'&&h.uv){const yy=(1-h.uv.y)*592;const i=Math.floor((yy-148)/62);const it=api.itens()[i];if(i>=0&&i<5&&it){api.livro(it.id);return;}}
      voltar();const t=porta.querySelector('.term3d');if(t)t.remove();return;}
    if(modo==='livro'){voltar();const l=porta.querySelector('.livro3d');if(l)l.remove();return;}
    if(!h)return;

    else if(h.k==='fantasma')api.go('ajustes',e.clientX,e.clientY);
    else if(h.k==='janela')relampago();
    else if(h.k==='poster')api.go('estante',e.clientX,e.clientY);
    else if(h.k==='kindle')api.go('fila',e.clientX,e.clientY);
    else if(h.k==='tv'){if(tvId){modo='livro';porta.classList.add('foco');api.livro(tvId);}else api.go('fila',e.clientX,e.clientY);}
    else if(h.k==='note'){if(noteId){modo='livro';porta.classList.add('foco');api.livro(noteId);}else api.go('fila',e.clientX,e.clientY);}
    else if(h.k==='musica'){if(musId){modo='livro';porta.classList.add('foco');api.livro(musId);}else api.go('fila',e.clientX,e.clientY);}
    else if(h.k==='envelope')api.go('agenda',e.clientX,e.clientY);
    else if(h.k==='tab'&&tabId){modo='livro';porta.classList.add('foco');api.livro(tabId);}
    else if(h.k==='cel'&&celId){modo='livro';porta.classList.add('foco');api.livro(celId);}
    else if(h.k==='livro'){puxar(h.id);api.livro(h.id);}
  });
  let giro=null;const ori=e=>{if(e.gamma==null)return;giro=[Math.max(-1,Math.min(1,e.gamma/25)),Math.max(-1,Math.min(1,(e.beta-45)/25))];};
  window.addEventListener('deviceorientation',ori);

  /* ---------- ações ---------- */
  function focarMonitor(){if(modo==='monitor')return;modo='monitor';porta.classList.add('foco');mirarMonitor();setTimeout(()=>{if(modo==='monitor'){api.abrirTermo();posicionarTermo();}},api.calmo()?0:650);}
  function puxar(id){const m=livros.get(id);modo='livro';porta.classList.add('foco');for(const o of livros.values())o.userData.alvo=0;
    if(m){m.userData.alvo=3;const p=m.userData.base;querAlvo.set(p.x,p.y+.2,p.z);querPos.set(p.x*.7+.1,p.y+1.25,p.z+1.5);}}
  function voltar(){for(const o of livros.values())o.userData.alvo=0;irBase();}
  let flash=0;function relampago(){flash=1;}
  /* bola de papel voa do monitor e vira o livro novo (M2, M4) */
  const bolaG=new T.IcosahedronGeometry(.06,2);{const p=bolaG.attributes.position;for(let i=0;i<p.count;i++){const v=new T.Vector3().fromBufferAttribute(p,i);v.multiplyScalar(.75+Math.random()*.45);p.setXYZ(i,v.x,v.y,v.z);}bolaG.computeVertexNormals();}
  const bola=new T.Mesh(bolaG,M({color:0xF7F2EA,roughness:.95,flatShading:true}));bola.visible=false;bola.castShadow=true;scene.add(bola);
  let voo=null;
  function chegou(id){construirLivros();novoId=id;novoT=0;desenharTudo();rotulos.forEach(r=>r.el.innerHTML=r.html());
    const m=livros.get(id);if(!m)return;m.visible=false;voo={t:0,de:new T.Vector3(MON.x,MON.y,MON.z+.15),para:m.userData.base.clone(),m};bola.visible=true;}

  /* ---------- laço ---------- */
  let revela=0,raf=0,ultimo=0,rodando=false,inicio=0,piscar=0,degradou=false,medido=false,m0=0,mq=0,proxRaio=8+Math.random()*12;
  const fpsJanela=[];
  function quadro(agora){
    raf=requestAnimationFrame(quadro);
    const dt=Math.min(.05,(agora-(ultimo||agora))/1000);ultimo=agora;uT.value+=dt;
    fpsJanela.push(agora);while(fpsJanela.length&&agora-fpsJanela[0]>1000)fpsJanela.shift();window.__talseFps=fpsJanela.length;
    if(!medido&&agora-inicio>700){if(!m0){m0=agora;mq=0;}mq++;
      if(agora-m0>=2000){const f=mq*1000/(agora-m0);window.__talseFpsInicial=Math.round(f);m0=0;const custo=f<50?window.__talseBench(8):0;window.__talseCusto=custo;
        if(custo>12&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);redimensionar();sombras();inicio=agora;}else{medido=true;if(custo>30&&!degradou){degradou=true;api.degradar();return;}}}}
    const calmo=api.calmo();
    const k=1-Math.exp(-dt*4.2);
    const ox=modo==='sala'&&!calmo?((giro?giro[0]:px)*.16):0,oy=modo==='sala'&&!calmo?((giro?giro[1]:py)*-.07):0;
    camPos.x+=(querPos.x+ox-camPos.x)*k;camPos.y+=(querPos.y+oy-camPos.y)*k;camPos.z+=(querPos.z-camPos.z)*k;camAlvo.lerp(querAlvo,k);cam.position.copy(camPos);cam.lookAt(camAlvo);
    for(const m of livros.values()){const u=m.userData;u.ergue+=(u.alvo-u.ergue)*Math.min(1,dt*8);if(u.mesa){m.position.z=u.base.z+u.ergue*.05;m.position.y=u.base.y;m.rotation.y=u.rot;}else{m.position.y=u.base.y+u.ergue*.05;m.rotation.y=u.rot+u.ergue*.12;m.rotation.x=-u.ergue*.12;}}
    if(voo){voo.t=Math.min(1,voo.t+dt*.95);const t=voo.t,e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;bola.position.lerpVectors(voo.de,voo.para,e);bola.position.y+=Math.sin(t*Math.PI)*.9;bola.rotation.x+=dt*9;bola.rotation.z+=dt*6;
      if(t>=1){bola.visible=false;voo.m.visible=true;voo.m.userData.alvo=3;const mm2=voo.m;setTimeout(()=>{mm2.userData.alvo=0;},500);voo=null;sombras();}}
    if(!calmo){ORB.children.forEach(c=>{if(c.userData.eixo)c.rotateOnAxis(c.userData.eixo,dt*c.userData.vel);});aneis.forEach(a=>a.rotateZ(dt*a.userData.giro));ORB.position.y=1.3+Math.sin(uT.value*.8)*.04;
      FAN.position.y=1.55+Math.sin(uT.value*1.3)*.05;FAN.rotation.z=Math.sin(uT.value*.9)*.04;FAN.rotation.y+=((.15+(giro?giro[0]:px)*.6)-FAN.rotation.y)*Math.min(1,dt*3);
      if(revela<1){revela=Math.min(1,revela+dt/2.6);renderer.toneMappingExposure=.15+1.15*(1-Math.pow(1-revela,3));}
      for(const p of plantasVivas){p.o.rotation.z=p.rz+Math.sin(uT.value*.9+p.f)*.022;p.o.rotation.x=p.rx+Math.cos(uT.value*.7+p.f)*.016;}}
    proxRaio-=dt;if(proxRaio<=0&&!calmo){flash=1;proxRaio=12+Math.random()*16;}
    flash=Math.max(0,flash-dt*3.2);const fl=flash>0?(Math.sin(flash*40)>0?flash:flash*.35):0;uFlash.value=fl;luzJanela.intensity=.75+fl*2.2;
    if(novoId&&novoT<200){novoT+=dt*40;desenharMonitor();}
    piscar+=dt;if(piscar>.53){piscar=0;cursorOn=!cursorOn;desenharMonitor();}
    moverRotulos();posicionarTermo();
    renderer.render(scene,cam);
  }
  function resume(){if(rodando)return;rodando=true;ultimo=0;irBase();camPos.copy(querPos).add(new T.Vector3(0,.3,1.4));camAlvo.copy(querAlvo);desenharTudo();rotulos.forEach(r=>r.el.innerHTML=r.html());raf=requestAnimationFrame(quadro);}
  function pause(){rodando=false;cancelAnimationFrame(raf);}
  const vis=()=>{if(document.hidden)pause();else if(!porta.hidden)resume();};
  document.addEventListener('visibilitychange',vis);
  const ro=new ResizeObserver(redimensionar);ro.observe(canvas);
  construirLivros();redimensionar();
  /* v5: compila os shaders antes do primeiro quadro (sem engasgo na abertura) */
  try{if(renderer.compileAsync)await renderer.compileAsync(scene,cam);}catch(e){}
  inicio=performance.now()+800;resume();
  window.__talseBench=(n=60)=>{const gl=renderer.getContext();gl.finish();const t=performance.now();for(let i=0;i<n;i++)renderer.render(scene,cam);gl.finish();return +((performance.now()-t)/n).toFixed(2);};
  return {
    pause,resume,voltar,puxar,focarMonitor,chegou,
    entrar(){return Promise.resolve();},
    refresh(){construirLivros();desenharTudo();rotulos.forEach(r=>r.el.innerHTML=r.html());},
    destroy(){pause();ro.disconnect();document.removeEventListener('visibilitychange',vis);window.removeEventListener('deviceorientation',ori);hots.innerHTML='';texturas.forEach(t=>t.dispose());renderer.dispose();}
  };
}

/* ---------- papel amassado que desdobra de verdade (M2, ref. recent.design) ----------
   Uma tela WebGL por cima do app: a folha sai de uma bola amassada e abre plana, guardando os vincos.
   Depois some e o HTML real aparece no mesmo lugar. */
let amassa=null;
async function desamassar(el,desenha){
  if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return false;
  const T=await carregarThree();
  const r=el.getBoundingClientRect();if(r.width<40||r.height<40||r.bottom<0||r.top>innerHeight)return false;
  if(!amassa){
    const c=document.createElement('canvas');c.className='amassa';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
    let ren;try{ren=new T.WebGLRenderer({canvas:c,alpha:true,antialias:true});}catch(e){c.remove();return false;}
    ren.setPixelRatio(Math.min(devicePixelRatio||1,2));const sc=new T.Scene();const cm=new T.OrthographicCamera(0,1,0,1,-2000,2000);
    amassa={c,ren,sc,cm,ativo:0};
  }
  const A=amassa;A.ren.setSize(innerWidth,innerHeight,false);A.cm.left=0;A.cm.right=innerWidth;A.cm.top=0;A.cm.bottom=-innerHeight;A.cm.updateProjectionMatrix();
  const cv=document.createElement('canvas');const k=Math.min(2,devicePixelRatio||1);cv.width=Math.round(r.width*k);cv.height=Math.round(r.height*k);const g=cv.getContext('2d');g.scale(k,k);desenha(g,r.width,r.height);
  const tex=new T.CanvasTexture(cv);tex.colorSpace=T.SRGBColorSpace;
  const geo=new T.PlaneGeometry(r.width,r.height,40,40);
  const mat=new T.ShaderMaterial({transparent:true,uniforms:{t:{value:0},tex:{value:tex},tam:{value:new T.Vector2(r.width,r.height)}},
    vertexShader:`uniform float t;uniform vec2 tam;varying vec2 vUv;varying vec3 vP;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float vinco(vec2 uv){return abs(n(uv*4.)-.5)*2.+abs(n(uv*9.+3.)-.5);}
      void main(){vUv=uv;float e=t<1.?1.-pow(1.-t,3.):1.;
        float R=min(tam.x,tam.y)*.3;float lon=(uv.x-.5)*5.2,lat=(uv.y-.5)*2.9;float s=R*(.8+.45*n(uv*7.));
        vec3 bola=vec3(s*cos(lat)*sin(lon),s*sin(lat),s*cos(lat)*cos(lon));
        vec3 plano=vec3(position.xy,(vinco(uv)-.7)*mix(26.,4.,e));
        vec3 p=mix(bola,plano,e);
        float a=(1.-e)*-.7;p.xy=mat2(cos(a),-sin(a),sin(a),cos(a))*p.xy;
        vP=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`uniform sampler2D tex;uniform float t;varying vec2 vUv;varying vec3 vP;
      void main(){vec3 nn=normalize(cross(dFdx(vP),dFdy(vP)));if(nn.z<0.)nn=-nn;float l=clamp(dot(nn,normalize(vec3(-.35,.45,1.))),0.,1.);
        vec4 c=texture2D(tex,vUv);c.rgb*=.62+.5*l;gl_FragColor=vec4(c.rgb,c.a*clamp(t*4.,0.,1.));
        #include <colorspace_fragment>
      }`});
  const m=new T.Mesh(geo,mat);m.position.set(r.left+r.width/2,-(r.top+r.height/2),0);A.sc.add(m);
  el.style.visibility='hidden';A.c.style.opacity='1';A.ativo++;
  await new Promise(res=>{const t0=performance.now();const passo=a=>{const t=Math.min(1,(a-t0)/820);mat.uniforms.t.value=t;A.ren.render(A.sc,A.cm);if(t<1)requestAnimationFrame(passo);else res();};requestAnimationFrame(passo);});
  el.style.visibility='';
  await new Promise(res=>setTimeout(res,60));
  A.sc.remove(m);geo.dispose();mat.dispose();tex.dispose();A.ativo--;if(!A.ativo){A.ren.clear();A.c.style.opacity='0';}
  return true;
}
window.TalseScene={mount};
window.TalseAmassa={desamassar};
